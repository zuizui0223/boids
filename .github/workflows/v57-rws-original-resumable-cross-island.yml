name: v57 original RWS resumable quarters and unchanged v56 cross-island bearing
on:
  push:
    paths:
      - 'validation_v57/**'
      - 'docs/V57_FROZEN_SAME_SOURCE_RWS_TRANSPORT_RESUME.md'
      - '.github/workflows/v57-rws-original-resumable-cross-island.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v57-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original_source_and_unchanged_cross_site:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: validation_v29:validation_v30:validation_v31:validation_v32:validation_v33:validation_v34:validation_v39:validation_v40:validation_v41:validation_v43:validation_v52:validation_v53:validation_v54:validation_v55:validation_v56:validation_v57
      BOIDS_ORIGINAL_RWS_CACHE_DIR: /tmp/boids_original_rws_v57_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore authenticated original RWS monthly source cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/boids_original_rws_v57_cache
          key: rws-v57-source-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rws-v57-source-${{ github.ref_name }}-
      - name: Test original month and quarter reconstruction and prior model controls
        run: |
          python -m unittest discover -s validation_v57 -p 'test_*.py' -v
          python -m unittest discover -s validation_v56 -p 'test_*.py' -v
          python -m unittest discover -s validation_v55 -p 'test_*.py' -v
          python -m unittest discover -s validation_v53 -p 'test_*.py' -v
          python -m unittest discover -s validation_v52 -p 'test_*.py' -v
          python -m unittest discover -s validation_v41 -p 'test_*.py' -v
          python -m unittest discover -s validation_v43 -p 'test_*.py' -v
      - name: Original same-source RWS and unchanged v56 both-island directional holdout
        run: |
          python validation_v57/run_original_resumable_cross_island.py --source-cache-dir "$BOIDS_ORIGINAL_RWS_CACHE_DIR" --output /tmp/v57-original-cross-island.json
      - name: Preserve authenticated original RWS source cache even after transport STOP
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/boids_original_rws_v57_cache
          key: rws-v57-source-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve ONLY aggregate source receipts and cross-island scores
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v57-original-two-island-tidal-bearings
          path: /tmp/v57-original-cross-island.json
          retention-days: 90
          if-no-files-found: error
