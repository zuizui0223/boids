name: Fish-school v12 self-sustaining acoustic-feedback Boids known-truth
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths:
      - 'validation_fish_boids_v12/**'
      - '.github/workflows/fish-school-v12-acoustic-feedback.yml'
      - 'docs/V12_ACOUSTIC_BOIDS_FEEDBACK_HYPOTHESIS.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Test analytic threshold and independent Boids motor fixture
        run: python -m unittest discover -s validation_fish_boids_v12 -p 'test_*.py' -v
      - name: Evaluate low/high feedback and paired no-playback 32-boid source-free scenarios
        run: python validation_fish_boids_v12/acoustic_feedback.py
      - uses: actions/upload-artifact@v4
        with:
          name: fish-school-v12-acoustic-feedback-synthetic-only
          path: validation_fish_boids_v12/results/acoustic_feedback_synthetic.json
          retention-days: 30
