name: v161 authentic porpoise site-internal prior-year to later-year foraging source holdout
on:
  push:
    branches: ["research/v161-*"]
  pull_request:
    paths:
      - "validation_v161/**"
      - "docs/V161*"
      - ".github/workflows/v161-porpoise-temporal-holdout.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_source_SITE_year_holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen original-data logistic dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2
      - name: Synthetic year identity and strict temporal source gate tests
        run: python -m unittest discover -s validation_v161 -p 'test_*.py' -v
      - name: Re-fetch original porpoise C-POD CSV and fit all 43 SITE earlier-year to later-year source models
        run: python validation_v161/porpoise_temporal_holdout.py --emit
      - name: Save site-year source-safe proper score audit, no original click time series
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v161-original-porpoise-site-internal-year-heldout
          path: validation_v161/results/porpoise_temporal_holdout_full_v161.json
          if-no-files-found: warn
