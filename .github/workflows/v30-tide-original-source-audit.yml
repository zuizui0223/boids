name: v30 original shorebird GPS and RWS historical tidal source-only admission
on:
  push:
    paths:
      - 'validation_v30/**'
      - 'docs/V30_REAL_SOURCE_TIDE_ADMISSION.md'
      - '.github/workflows/v30-tide-original-source-audit.yml'
  pull_request:
    paths:
      - 'validation_v30/**'
      - 'docs/V30_REAL_SOURCE_TIDE_ADMISSION.md'
      - '.github/workflows/v30-tide-original-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests for original-field and source gates
        env:
          PYTHONPATH: validation_v30
        run: python -m unittest discover -s validation_v30 -p 'test_*.py' -v
      - name: Original GPS 2008 and 2009 bytes, provider MD5 and sampling audit
        id: zenodo
        continue-on-error: true
        run: |
          python validation_v30/source_preflight.py --years 2008 2009 --output /tmp/boids_v30_gps.json
      - name: RWS catalogue and historical 2008 measured NAP/source metadata probe
        id: rws
        continue-on-error: true
        run: |
          python validation_v30/rws_source_probe.py --output /tmp/boids_v30_rws.json
      - name: Original-source admission receipts, no raw fixes or tide movement claim
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['gps','rws']:
              p=Path('/tmp/boids_v30_'+name+'.json')
              if not p.exists():
                  print(name.upper()+' : STOP_ORIGINAL_SOURCE_UNREACHABLE_OR_FAILED')
                  continue
              r=json.loads(p.read_text())
              print(name.upper()+': '+json.dumps(r,sort_keys=True))
          PY
          echo 'Evidence type: original-source admission only, no tide or social movement effect estimated.'
