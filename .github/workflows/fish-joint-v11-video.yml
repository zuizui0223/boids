name: Fish school/chorus v11 original XAV video and hydrophone same-scene gate
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths:
      - 'validation_fish_joint_v11/**'
      - '.github/workflows/fish-joint-v11-video.yml'
      - 'docs/V11_SAME_SCENE_FISH_MOVEMENT_AND_CALL_FREEZE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-av-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'pillow>=10,<13' 'opencv-python-headless>=4.10,<5' 'numpy>=1.26,<3'
      - name: Source-only known-truth scene identification fixtures
        run: python -m unittest discover -s validation_fish_joint_v11 -p 'test_*.py' -v
      - name: Authenticate published OSF video + locked original sound event source, frame contact sheets
        run: python validation_fish_joint_v11/original_video_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: fish-joint-v11-original-figure9-10-video-contact-and-acoustic
          path: |
            validation_fish_joint_v11/results/video_audio_scene_manifest.json
            validation_fish_joint_v11/results/frames/*.png
          retention-days: 30
