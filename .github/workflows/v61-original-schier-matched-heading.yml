name: v61 original Schier 211 actual phase-paired wild heading test
on:
  push:
    paths:
      - 'validation_v61/**'
      - 'docs/V61_FROZEN_SCHIER_OBSERVED_PAIRED_HEADING.md'
      - '.github/workflows/v61-original-schier-matched-heading.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v61-original-schier-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original_schier_2011_paired_heading:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: validation_v29:validation_v30:validation_v31:validation_v32:validation_v33:validation_v34:validation_v39:validation_v40:validation_v41:validation_v43:validation_v52:validation_v53:validation_v54:validation_v55:validation_v56:validation_v57:validation_v58:validation_v59:validation_v60:validation_v61
      BOIDS_ORIGINAL_RWS_CACHE_DIR: /tmp/boids_original_rws_v61_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original numerical requirements
        run: python -m pip install -r requirements.txt
      - name: Restore original Schier RWS official measurement transport
        uses: actions/cache/restore@v4
        with:
          path: /tmp/boids_original_rws_v61_cache
          key: rws-v61-original-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rws-v61-original-${{ github.ref_name }}-
      - name: New Schier source and unchanged v60/59 real pair direction tests
        run: |
          python -m unittest discover -s validation_v61 -p 'test_*.py' -v
          python -m unittest discover -s validation_v60 -p 'test_*.py' -v
          python -m unittest discover -s validation_v59 -p 'test_*.py' -v
          python -m unittest discover -s validation_v58 -p 'test_*.py' -v
          python -m unittest discover -s validation_v56 -p 'test_*.py' -v
          python -m unittest discover -s validation_v43 -p 'test_*.py' -v
      - name: Original source Schier 2010 fit and observed 2011 paired headings
        run: |
          python validation_v61/run_original_schier_paired_heading.py --source-cache-dir "$BOIDS_ORIGINAL_RWS_CACHE_DIR" --output /tmp/v61-original-schier-observed-pair-result.json
      - name: Save official cached original measurements after source stop
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/boids_original_rws_v61_cache
          key: rws-v61-original-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish aggregate-only original Schier paired heading result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v61-original-schier-observed-paired-real-phase-heading
          path: /tmp/v61-original-schier-observed-pair-result.json
          retention-days: 90
          if-no-files-found: error
