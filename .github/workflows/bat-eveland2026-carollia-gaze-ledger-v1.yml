name: original 2026 Carollia 8-bat 30-trial sonar future-heading result ledger replay
on:
  push:
    branches: ["prospective/bat-acoustic-game-no-new-measurements-v1"]
    paths:
      - "theory/bat_acoustic_game/EVELAND_2026_REAL_CAROLLIA_GAZE_BAT_HOLDOUT_LEDGER_V1.json"
      - "theory/bat_acoustic_game/verify_eveland_2026_gaze_holdout_ledger_v1.py"
      - ".github/workflows/bat-eveland2026-carollia-gaze-ledger-v1.yml"
  workflow_dispatch:
jobs:
  original-data-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: boids
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: 00keveland/Tunnel_2026
          ref: 59928a71887d521fec143080b0b187736c046a0e
          path: boids/upstream/eveland2026
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin original published trial HDF5 scientific versions
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 h5py==3.12.1
      - name: Recompute original 30 trial real bat forecasts and verify all three horizon ledgers
        run: python verify_eveland_2026_gaze_holdout_ledger_v1.py
        working-directory: boids/theory/bat_acoustic_game
