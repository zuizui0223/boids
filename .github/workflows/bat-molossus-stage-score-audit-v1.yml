name: Molossus unchanged-model stage-score audit
on:
  push:
    branches: ["prospective/bat-acoustic-game-no-new-measurements-v1"]
    paths:
      - "theory/bat_acoustic_game/molossus_stage_score_v1.py"
      - "theory/bat_acoustic_game/test_molossus_stage_score_v1.py"
      - "theory/bat_acoustic_game/MOLOSSUS_STAGE_SCORE_AUDIT_PREOUTPUT_2026_11_06.md"
      - ".github/workflows/bat-molossus-stage-score-audit-v1.yml"
  workflow_dispatch:
jobs:
  stage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theory/bat_acoustic_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Regression suite for theory and original corrected Molossus models
        run: python -m unittest test_model_v1 test_endpoint_bridge_v2 test_molossus_2024_source_capture_LOBO_v1 test_molossus_2024_capture_corrected_v2 test_molossus_stage_score_v1 -v
      - name: Full acoustic-component test discovery
        continue-on-error: true
        run: python -m unittest discover -p 'test*.py' -v > /tmp/full-acoustic-tests.log 2>&1
      - name: Run original-data stage audit without modifying models
        run: python molossus_stage_score_v1.py
      - name: Verify scope and previous numerical results
        run: |
          python - <<'PY'
          import json
          x=json.load(open('MOLOSSUS_STAGE_SCORE_AUDIT_RESULT_V1.json'))
          assert x['previous_total_capture_scores_reproduced']
          assert x['original_M2_models_unchanged']
          assert x['package_diagnostic']['all_member_hashes_identical']
          assert x['all_ten']['bat_count']==10 and x['nine_clean']['bat_count']==9
          assert x['all_ten']['five_second_rows']==4299
          assert not x['new_measurements'] and not x['raw_bat_ids_or_rows_exported']
          print('STAGE_AUDIT_SCOPE_AND_SOURCE_CHECKS_PASSED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: molossus-stage-audit-aggregate-v1
          path: |
            theory/bat_acoustic_game/MOLOSSUS_STAGE_SCORE_AUDIT_RESULT_V1.json
            /tmp/full-acoustic-tests.log
          retention-days: 90
