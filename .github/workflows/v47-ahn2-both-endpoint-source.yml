name: v47 original AHN2 GPS B and C both-endpoint elevation source-only gate
on:
  push:
    paths:
      - 'validation_v47/**'
      - 'docs/V47_FROZEN_BOTH_GPS_ENDPOINTS_AHN2_SOURCE.md'
      - '.github/workflows/v47-ahn2-both-endpoint-source.yml'
  pull_request:
    paths:
      - 'validation_v47/**'
      - 'docs/V47_FROZEN_BOTH_GPS_ENDPOINTS_AHN2_SOURCE.md'
      - '.github/workflows/v47-ahn2-both-endpoint-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_gps_B_C_ahn2_no_tide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: [schiermonnikoog, ameland]
    env:
      PYTHONPATH: validation_v29:validation_v30:validation_v31:validation_v33:validation_v34:validation_v40:validation_v45:validation_v46:validation_v47
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original source geographic TIFF/NDVI tooling
        run: python -m pip install 'numpy>=1.24,<3' 'rasterio>=1.3,<2' 'pyproj>=3.5,<4'
      - name: Test original B plus C source geometry and unchanged original C source count
        run: python -m unittest discover -s validation_v47 -p 'test_*.py' -v
      - name: Audit original 2010 fixed AHN2 cells vs BOTH 2011 and 2012 original GPS movement endpoints without tide
        env:
          SITE: ${{ matrix.site }}
        run: |
          python validation_v47/ahn2_both_original_endpoints_source.py --site "$SITE" --output "/tmp/v47-ahn2-${SITE}-BC.json"
      - name: Preserve only original source and aggregate B plus C coverage gates
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v47-historical-AHN2-both-GPS-endpoints-${{ matrix.site }}
          path: /tmp/v47-ahn2-*-BC.json
          retention-days: 90
