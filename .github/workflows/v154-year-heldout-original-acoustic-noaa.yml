name: v154 original NOAA tide proxy vs solar + acoustic partner heldout-year scores
on:
  push:
    branches: ["research/v154-*"]
  pull_request:
    paths:
      - "validation_v154/**"
      - "docs/V154*"
      - ".github/workflows/v154-year-heldout-original-acoustic-noaa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_noaa_year_holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed original reader, solar and logistic-score tools
        run: python -m pip install xlrd==2.0.2 astral==3.2 numpy==2.1.3 scikit-learn==1.5.2 scipy==1.14.1
      - name: Synthetic known-truth heldout log loss and fixed support test
        run: python -m unittest discover -s validation_v154 -p 'test_*.py' -v
      - name: Reacquire exact 60 original fish files and 14 provider-SHA verified NOAA source years; fit heldout models
        run: python validation_v154/v154_year_holdout.py --check
      - name: Preserve only original site/year aggregate scores, not raw fish or tide observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v154-original-noaa-heldout-year-fish-acoustic-scores
          path: validation_v154/results/heldout_acoustic_gauge_v154.json
          if-no-files-found: warn
