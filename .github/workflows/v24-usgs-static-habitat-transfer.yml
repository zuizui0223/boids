name: v24-S original USGS brood-heldout static environmental wetland preference

on:
  push:
    paths:
      - "validation_v24/static_habitat_transfer.py"
      - "validation_v24/test_static_habitat_transfer.py"
      - "docs/V24_FROZEN_BROOD_HELDOUT_STATIC_HABITAT_CHOICE.md"
      - ".github/workflows/v24-usgs-static-habitat-transfer.yml"
  pull_request:
    paths:
      - "validation_v24/static_habitat_transfer.py"
      - "validation_v24/test_static_habitat_transfer.py"
      - "docs/V24_FROZEN_BROOD_HELDOUT_STATIC_HABITAT_CHOICE.md"
      - ".github/workflows/v24-usgs-static-habitat-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-usgs-brood-heldout-static-pseudochoice:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed-major sklearn and original source numerical dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3" "scipy>=1.11,<2" "scikit-learn>=1.4,<2"
      - name: Test brood independence, source importance and conditional pseudo-choice known-truth BEFORE reading real habitat use scores
        env:
          PYTHONPATH: validation_v24
          OPENBLAS_NUM_THREADS: "1"
        run: python -m unittest discover -s validation_v24 -p 'test_static_habitat_transfer.py' -v
      - name: Download exact original USGS source, run outcome-blind fixed brood folds and four calendar-year holdouts
        env:
          PYTHONPATH: validation_v24
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python validation_v24/static_habitat_transfer.py --out validation_v24/results/static_brood_habitat_preference_v24.json
      - name: Enforce source design and all originally independent brood predictions
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path("validation_v24/results/static_brood_habitat_preference_v24.json").read_text())
          assert d["source_original_USGS_DOI"]=="10.5066/P13NYGAI"
          assert d["source_original_SHA256"]=="e4ac32416e2f013efcca8e40b9916e73c72e2e1891a09f78d865524ee16ea036"
          assert d["original_v24_future_visit_history_status"]=="NOT_ADMITTED_NO_DATED_WETLAND_CHOICE_OR_MATCHED_TEMPORAL_AVAILABILITY"
          assert d["source_original_nest_coordinates_or_habitat_rows_redistributed"] is False
          assert d["prior_v13_to_v23_frozen_outcomes_unchanged"] is True
          q=d["source_original_brood_data_structure"]
          assert q["source_broods"]==185
          assert q["source_used_location_rows"]==2069
          assert q["source_generated_available_locations"]==74000
          r=d["observed_source_habitat_result"]
          assert r["status"]=="EXPLORATORY_ORIGINAL_USGS_STATIC_HABITAT_PSEUDOCHOICE_BROOD_TRANSFER"
          assert r["original_independent_brood_count"]==185
          assert len(r["per_brood_anonymized"])==185
          assert len(d["registered_leave_one_year_out_results"])==4
          for x in r["absolute_brood_equal_metrics"].values():
              assert math.isfinite(x)
          for x in r["original_registered_contrasts"].values():
              assert x["original_independent_broods"]==185
              assert all(math.isfinite(q) for q in x["source_brood_bootstrap_95_percentile"])
          print("V24_SOURCE_GROUNDED_STATIC_CHOICE_FIVE_FOLD_AND_YEAR_TEST_COMPLETE")
          PY
      - name: Publish anonymized brood-level and per-year summary, never original wetland or radio brood locations
        uses: actions/upload-artifact@v4
        with:
          name: boids-v24-USGS-static-185-brood-habitat-choice-transfer
          path: validation_v24/results/static_brood_habitat_preference_v24.json
          if-no-files-found: error
          retention-days: 45
