name: v96 post-v95 source-failure and finite-hour physical reference sensitivity
on:
  push:
    paths:
      - 'validation_v96/**'
      - '.github/workflows/v96-source-null-physical-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine_2019_original_source_sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: validation_v89:validation_v92:validation_v93:validation_v94:validation_v95:validation_v96
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install numerical and astronomical dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'astral==3.2'
      - name: test descriptive source and finite-hour reference boundaries
        run: python -m unittest discover -s validation_v96 -p 'test_*.py' -v
      - name: Reuse 12 original data-authenticated 2019 UHSLC 2019 observed band artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42616065580 --repo zuizui0223/boids --pattern 'v94-2019-original-UHSLC-PHYSICAL-BAND-*' --dir /tmp/v94
      - name: Report true 50 source failures and robust cross-coast physical opportunity estimands
        run: |
          python -u validation_v96/physical_tidesun_source_null_sensitivity.py --artifact-dir /tmp/v94 --output /tmp/v96-physical-source-sensitivity.json
      - name: publish original global physical sensitivity (NOT a new ecological confirmation)
        uses: actions/upload-artifact@v4
        with:
          name: v96-genuine-2019-UHSLC-physical-multi-outcome-source-QA
          path: /tmp/v96-physical-source-sensitivity.json
          if-no-files-found: error
          retention-days: 90
