name: v201 original BAW Vlieland 2018 2019 WFS high low boundary hits only
on:
  push:
    branches: ["research/v201-*"]
  pull_request:
    paths:
      - "validation_v201/**"
      - "docs/V201*"
      - ".github/workflows/v201-original-BAW-WFS-Vlieland-boundary-hits-only.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_source_only_year_boundary_presence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: validation_v198:validation_v199:validation_v200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install authenticated public reference projection
        run: python -m pip install 'pyproj==3.7.1'
      - name: Strict frozen 10km source ROI and only WFS2 resultType hits controls
        run: |
          python -m compileall -q validation_v201
          python -m unittest discover -s validation_v201 -p 'test_*.py' -v
      - name: Retrieve genuine original year high low WFS2 hits only, no geometry
        run: python -u validation_v201/true_BAW_WFS_Vlieland_2018_2019_highlow_boundary_HITS.py
      - name: Fail unless all four genuine source WFS2 HITS counts reported even if zero
        run: |
          python -c 'import json; from pathlib import Path; r=json.loads(Path("validation_v201/results/BAW_WFS_2018_2019_high_low_Vlieland_10km_original_hits_v201.json").read_text()); assert r["scientific_gates"]["four_fixed_original_year_high_low_WFS_HITS_counts_retrieved"] is True, r.get("four_year_high_low_native_source_HITS")'
      - name: Preserve only original response SHA and matched features counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v201-BAW-original-WFS-2018-2019-highlow-Vlieland10km-HITS-only
          path: validation_v201/results/BAW_WFS_2018_2019_high_low_Vlieland_10km_original_hits_v201.json
          if-no-files-found: warn
