name: v19 independent thirteen-pair post-source-availability exploratory future-route GPS test

on:
  push:
    paths:
      - "validation_v19/**"
      - "docs/V19_EXPLORATORY_COMPLETECASE_13PAIR_MEMORY_CONTRACT.md"
      - ".github/workflows/completecase-thirteen-pair-memory-v19.yml"
  pull_request:
    paths:
      - "validation_v19/**"
      - "docs/V19_EXPLORATORY_COMPLETECASE_13PAIR_MEMORY_CONTRACT.md"
      - ".github/workflows/completecase-thirteen-pair-memory-v19.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-post-availability-exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen major-version numerical dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Known-truth source-only O19 stop and no-future-CM regression tests
        env:
          PYTHONPATH: validation_v17:validation_v18:validation_v19
          OPENBLAS_NUM_THREADS: "1"
        run: python -m unittest discover -s validation_v19 -p 'test_*.py' -v
      - name: Run prospective original TR to future CM route forecasts without modifying frozen v18
        env:
          PYTHONPATH: validation_v17:validation_v18:validation_v19
          PYTHONUNBUFFERED: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          python validation_v19/complete_case_memory.py --out validation_v19/results/thirteen_pair_route_memory_v19.json
      - name: Enforce 13 external source pairs and exploratory result constraints
        run: |
          python - <<'PY'
          import json,math
          from pathlib import Path
          d=json.loads(Path("validation_v19/results/thirteen_pair_route_memory_v19.json").read_text())
          assert d["source_provenance"]["gps_original_ZIP_SHA256"]=="8e3f588ae927ab196f8c9dc9eebc9146bf656b344e68db8ba5f3c20d49edc3dc"
          assert d["source_provenance"]["metadata_SHA256"]=="8796f115d80f13b455704a2ad4c8710e23b18103ab0ba6d913c553fbd7342279"
          assert d["source_provenance"]["original_source_pair_count"]==14
          assert d["source_only_stage_gate"]["excluded_pair_without_any_CM"]=="O19"
          assert d["source_only_stage_gate"]["excluded_pair_cm_filename_count"]==0
          assert d["evaluation_pair_count"]==13
          assert d["original_v18_full_cohort_confirmatory_status"]=="NOT_ADMITTED_ORIGINAL_FILENAME_STAGE_SITE_GATE"
          assert d["prior_v6_v8_v15_v16_v17_B_and_v18_endpoints_unchanged"]
          assert d["raw_source_GPS_coordinates_or_event_level_targets_exported"] is False
          a=d["result"]
          assert a["status"] in (
              "NOT_ADMITTED_V19_SOURCE_FILE_STRUCTURE",
              "NOT_ADMITTED_V19_FROZEN_CM_CROSSING_SUPPORT",
              "EXPLORATORY_POST_SOURCE_AVAILABILITY_13_PAIR_MEMORY")
          if a["status"]=="EXPLORATORY_POST_SOURCE_AVAILABILITY_13_PAIR_MEMORY":
              assert len(a["per_pair"])==13
              assert "O19" not in a["per_pair"]
              for k in ("primary_pair_history","secondary_individual_history"):
                  assert a[k]["n_independent_pairs"]==13
                  assert math.isfinite(a[k]["equal_pair_mean_gain_rad2"])
              print("V19_EXPLORATORY_13_PAIR_MEMORY_RESULT_FROZEN")
          else:
              assert a["any_prediction_scores_computed"] is False
              print("V19_SOURCE_OR_TARGET_SUPPORT_NOT_ADMITTED",a["status"])
          PY
      - name: Archive only aggregate pair-level results; no original GPS released
        uses: actions/upload-artifact@v4
        with:
          name: boids-v19-exploratory-13pair-future-route-memory
          path: validation_v19/results/thirteen_pair_route_memory_v19.json
          retention-days: 45
          if-no-files-found: error
