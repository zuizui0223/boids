name: v92 authentic 2019 global hourly tide x solar physical pilot (NO animal outcome)
on:
  push:
    paths:
      - 'validation_v92/**'
      - '.github/workflows/v92-original-global-hourly-tide-solar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v92_original_global_2019_hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: validation_v89:validation_v92
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install astronomy and numerical dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'astral==3.2'
      - name: Validate native time records, harmonic classification and solar UTC known truth
        run: python -m unittest discover -s validation_v92 -p 'test_*.py' -v
      - name: Fetch UHSLC actual 2019 hourly levels at lowest quality-eligible ID in each 15-degree latitude band; score physical solar overlap ONLY
        run: |
          python -u validation_v92/original_UHSLC_2019_tide_solar.py --output /tmp/v92-original-UHSLC-2019-global-physical.json
      - name: Publish full source IDs, QC failures and site/month/day physical summaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v92-observed-UHSLC-2019-original-global-hourly-tide-solar-PHYSICAL-ONLY
          path: /tmp/v92-original-UHSLC-2019-global-physical.json
          retention-days: 90
          if-no-files-found: error
