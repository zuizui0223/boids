name: v221 true 2018 2019 tagged oystercatcher GPS ACC source to BAW WCS native 20min time geography
on:
  push:
    branches: ["research/v221-*"]
  pull_request:
    paths:
      - "validation_v221/**"
      - "docs/V221*"
      - ".github/workflows/v221-original-bird-GPS-ACC-to-BAW-20min-source-admission.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real_original_2018_2019_bird_GPS_ACC_to_BAW_native_axes:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONPATH: validation_v109:validation_v110:validation_v111:validation_v125:validation_v126:validation_v127:validation_v128:validation_v129:validation_v130:validation_v165:validation_v166:validation_v167:validation_v168:validation_v194:validation_v195:validation_v216:validation_v217
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned original source zenodo bird GPS ACC and official WCS source dependencies
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2' 'pyproj==3.7.1'
      - name: Freeze authentic 2018 2019 prior15 source cohorts, native 20min clock and no animal outcome selection
        run: |
          python -m compileall -q validation_v221
          python -m unittest discover -s validation_v221 -p 'test_*.py' -v
      - name: Recover only cryptographically frozen original 2018 and 2019 bird ACC GPS source receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v128 /tmp/v129 /tmp/v126gps /tmp/v126rws /tmp/v127
          gh run download 43463270204 --repo zuizui0223/boids --name v128-ORIGINAL-2018-VLIELAND-ACC-GPS-JUNESEP-2019-BIRD-OVERLAP-SOURCE-ONLY --dir /tmp/v128
          gh run download 43579877533 --repo zuizui0223/boids --name v129-ORIGINAL-2018-VLIELAND-ACC-CLASS-FORAGE-MEASURED-RWS-SOLAR-HISTORICAL-OR-STOP --dir /tmp/v129
          gh run download 43220491868 --repo zuizui0223/boids --name v126-GENUINE-2019-VLIELAND-FORAGE-INACTIVE-GPS-15MIN-25KM-SOURCE --dir /tmp/v126gps
          gh run download 43220491868 --repo zuizui0223/boids --name v126-ORIGINAL-RWS-2019-VLIELAND-HAVEN-MEASURED-TIDE-SOURCE --dir /tmp/v126rws
          gh run download 43461048062 --repo zuizui0223/boids --name v127-ORIGINAL-2019-VLIELAND-ACC-CLASS-FORAGE-RWS-TIDE-SUN-OR-SOURCE-STOP --dir /tmp/v127
          test -s /tmp/v128/v128-original-Vlieland-2018-ACC-GPS-source-only.json
          test -s /tmp/v129/v129-original-2018-Vlieland-ACC-forage-share-true-RWS-tide-sun-historical.json
          test -s /tmp/v126gps/v126-real-2019-Vlieland-forage-inactive-GPS-MD5-15min-source-only.json
          test -s /tmp/v126rws/v126-real-2019-RWS-Vlieland-Haven-10min-original-NAP-source-only.json
          test -s /tmp/v127/v127-original-2019-Vlieland-ACC-forage-share-true-RWS-tide-sun-fourway.json
      - name: Authenticated native BAW 2018 2019 WCS and true bird event time and GPS source geo-eligibility, no GetCoverage
        run: |
          python -u validation_v221/original_real_birdGPS_ACC_to_BAW20min_WCS_source_clock_gate.py --v128 /tmp/v128/v128-original-Vlieland-2018-ACC-GPS-source-only.json --v129 /tmp/v129/v129-original-2018-Vlieland-ACC-forage-share-true-RWS-tide-sun-historical.json --v126-gps /tmp/v126gps/v126-real-2019-Vlieland-forage-inactive-GPS-MD5-15min-source-only.json --v126-rws /tmp/v126rws/v126-real-2019-RWS-Vlieland-Haven-10min-original-NAP-source-only.json --v127 /tmp/v127/v127-original-2019-Vlieland-ACC-forage-share-true-RWS-tide-sun-fourway.json
      - name: Fail unless true two original full-year previous15 cohorts and official WCS source axes obtained
        run: |
          python -c 'import json; from pathlib import Path; d=json.loads(Path("validation_v221/results/real_original_Vlieland_oystercatcher_GPS_15min_to_BAW_WCS20min_source_admission_v221.json").read_text()); assert d["scientific_gates"]["both_years_true_original_Zenodo_GPS_ACC_RWS_and_BAW_native_source_admitted"] is True,d.get("source_error_summary"); assert d["scientific_gates"]["source_2018_prev15_animal_bins_preserved"] and d["scientific_gates"]["source_2019_prev15_animal_bins_preserved"]; assert d["scientific_gates"]["original_bird_cell_BAW_WCS_water_height_or_missingness_observed"] is False'
      - name: Preserve aggregate true-bird GPS temporal alignment and native BAW coverage, never raw tracks or animal labels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v221-real-original-oystercatcher-2018-2019-GPS-ACC-to-BAW-WCS20min-source-admission
          path: validation_v221/results/real_original_Vlieland_oystercatcher_GPS_15min_to_BAW_WCS20min_source_admission_v221.json
          if-no-files-found: warn
