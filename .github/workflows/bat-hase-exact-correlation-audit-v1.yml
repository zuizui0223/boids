name: bat source waveform exact-correlation post-output audit
on:
  push:
    branches: ["prospective/bat-acoustic-game-no-new-measurements-v1"]
    paths:
      - "theory/bat_acoustic_game/hase_waveform_postoutput_numeric_audit_v1.py"
      - ".github/workflows/bat-hase-exact-correlation-audit-v1.yml"
  workflow_dispatch:
jobs:
  numeric-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theory/bat_acoustic_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Validate ALL original v2 scenarios with exact non-binned correlations
        run: python hase_waveform_postoutput_numeric_audit_v1.py
      - name: Verify unchanged source and scientific stop
        run: |
          python - <<'PY'
          import json
          x=json.load(open("HASE_WAVEFORM_V2_POSTOUTPUT_NUMERIC_AUDIT_V1.json"))
          assert x["schema"]==1 and not x["new_animal_measurements"]
          assert not x["source_2026_group_reproduced"]
          assert len(x["worlds"])==12 and x["all_source_conditions_unchanged"]
          print("EXACT_COMPLETED",x["off_grid_fixture"],x["max_absolute_change_in_JAR_delta"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-hase-exact-correlation-numerical-v1
          path: theory/bat_acoustic_game/HASE_WAVEFORM_V2_POSTOUTPUT_NUMERIC_AUDIT_V1.json
          retention-days: 30
