name: bat 2026 original 3D bat3d Python code source-only range admission
on:
  push:
    branches: ["prospective/bat-acoustic-game-no-new-measurements-v1"]
    paths:
      - "theory/bat_acoustic_game/STECKEL_2026_3D_RANGE_SOURCE_CODE_PREOUTPUT_2026_11_08.md"
      - "theory/bat_acoustic_game/steckel_2026_range_code_source_gate_v1.py"
      - "theory/bat_acoustic_game/test_steckel_2026_range_code_source_gate_v1.py"
      - ".github/workflows/bat-steckel2026-original-3D-code-source-gate-v1.yml"
  workflow_dispatch:
jobs:
  author-source-code-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theory/bat_acoustic_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run invented ZIP range, CRC and inner bat3d package tests
        run: python -m unittest test_steckel_2026_range_code_source_gate_v1 -v
      - name: Extract publisher-original Python CODE ONLY through bounded 12 MB Range from 988 MB archive
        run: python steckel_2026_range_code_source_gate_v1.py
      - name: Ensure no published simulation outcome opened or original files redistributed
        run: |
          python - <<'PY'
          import json
          p="STECKEL_2026_3D_ORIGINAL_CODE_SOURCE_GATE_V1.json"
          x=json.load(open(p))
          assert x["schema"]==1
          assert not x["original_2026_code_executed"]
          assert not x["original_simulated_3D_accuracy_values_opened"]
          assert not x["original_model_checkpoint_or_3D_echoes_opened"]
          assert x["no_new_animal_measurements"]
          assert not x["original_author_files_rehosted"]
          assert not x["original_archive_read_whole"]
          assert x["status"]=="PASS_EXACT_ORIGINAL_3D_AUTHOR_CODE_AND_EXPERIMENT_INDEX_ONLY"
          print("BAT3D_AUTHOR_CODE_ONLY_SOURCE_ACCESS_12MB_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-Steckel2026-source-code-only-bounded-range-manifest-v1
          path: theory/bat_acoustic_game/STECKEL_2026_3D_ORIGINAL_CODE_SOURCE_GATE_V1.json
          retention-days: 45
