name: Fish-school v19 original crossed physical and auditory geometry holdout
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths:
      - 'validation_fish_boids_v19/**'
      - 'docs/V19_CROSSED_ACOUSTIC_MOTOR_GEOMETRY_FREEZE.md'
      - '.github/workflows/fish-boids-v19.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crossover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r validation_fish_boids_v15/requirements.txt
      - name: Known-truth original-v15 exact diagonal and acoustic decoupling tests
        run: python -m unittest discover -s validation_fish_boids_v19 -p 'test_*.py' -v
      - name: Original model new 768-seed census and 8 crossed response trajectories per eligible
        run: python validation_fish_boids_v19/score_crossed.py --output /tmp/v19-results --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: fish-boids-v19-crossed-geometry-and-hearing-synthetic-only
          path: /tmp/v19-results
          retention-days: 30
          if-no-files-found: error
