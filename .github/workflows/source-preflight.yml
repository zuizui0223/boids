name: Independent public 3D source preflight
on:
  push:
    paths:
      - 'validation_v6/source_preflight.py'
      - 'validation_v6/test_source_preflight.py'
      - '.github/workflows/source-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Verify metadata, checksum and schema before numeric outcomes
        run: python validation_v6/source_preflight.py --out validation_v6/results/bat_pair_schema.json
      - name: Source gate unit tests
        env:
          PYTHONPATH: validation_v6
        run: python -m unittest discover -s validation_v6 -p 'test_source_preflight.py' -v
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bat-pair-schema-only-v6
          path: validation_v6/results/bat_pair_schema.json
          retention-days: 7
