name: Fish-school v8 original velocity assignment and delayed horizon audit
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths:
      - 'validation_fish_school_v8/**'
      - '.github/workflows/fish-school-v8-assignment.yml'
      - 'docs/V8_ASSIGNMENT_AND_DELAY_FREEZE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned major dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - name: Original-source-independent matched permutation and delay fixtures
        run: python -m unittest discover -s validation_fish_school_v8 -p 'test_*.py' -v
      - name: Reverify MD5 all six Puy originals and audit six-trial velocity assignment vs short/delayed forward targets
        run: python validation_fish_school_v8/assignment_and_delay.py
      - uses: actions/upload-artifact@v4
        with:
          name: fish-school-v8-velocity-assignment-and-delay
          path: validation_fish_school_v8/results/assignment_and_delay.json
          retention-days: 30
