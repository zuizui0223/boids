name: v147 California original 60-source calendar-year chorus sign audit
on:
  push:
    branches: ["research/v147-*"]
  pull_request:
    paths:
      - "validation_v147/**"
      - "docs/V147*"
      - ".github/workflows/v147-year-stability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_source_year_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned original XLS reader
        run: python -m pip install xlrd==2.0.2 astral==3.2
      - name: New synthetic calendar-year and source arithmetic invariant checks
        run: python -m unittest discover -s validation_v147 -p 'test_*.py' -v
      - name: Reacquire all original 60 source XLS, validate all v145 source counts, and emit calendar-year rows
        run: python validation_v147/year_stability.py --emit
      - name: Preserve original-source aggregate only (no original XLS/audio)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v147-calendar-year-original-audit-aggregate
          path: validation_v147/results/source_year_stability_v147.json
          if-no-files-found: warn
