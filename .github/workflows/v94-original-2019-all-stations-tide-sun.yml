name: v94 all original UHSLC 2019 hourly tide x sunlight 12 latitude-band physical panel
on:
  push:
    paths:
      - 'validation_v94/**'
      - '.github/workflows/v94-original-2019-all-stations-tide-sun.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_all_world_station_hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        band: [N_00_15, N_15_30, N_30_45, N_45_60, N_60_75, N_75_90, S_00_15, S_15_30, S_30_45, S_45_60, S_60_75, S_75_90]
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: validation_v89:validation_v92:validation_v93:validation_v94
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned solar astronomy and numpy
        run: python -m pip install 'numpy>=1.24,<3' 'astral==3.2'
      - name: Run source physics known-truth tests
        run: python -m unittest discover -s validation_v94 -p 'test_*.py' -v
      - name: Reuse original 2019 source-frame 564-station UHSLC metadata verified in v89
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42608393924 --repo zuizui0223/boids --name v89-authentic-global-UHSLC-hourly-station-manifest-SOURCE-ONLY --dir /tmp/v89
          test -s /tmp/v89/v89-original-public-UHSLC-stations-with-datum-segments.json
      - name: Re-acquire all real 2019 hourly gauge records in this source-predeclared hemisphere/latitude band, compute physical tide-solar metrics
        run: |
          python -u validation_v94/global_2019_all_station_physical.py --v89-source-manifest /tmp/v89/v89-original-public-UHSLC-stations-with-datum-segments.json --band '${{ matrix.band }}' --output '/tmp/v94-2019-original-source-${{ matrix.band }}.json'
      - name: Upload complete QC, source success and failure and nonbiological physical summaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v94-2019-original-UHSLC-PHYSICAL-BAND-${{ matrix.band }}
          path: /tmp/v94-2019-original-source-${{ matrix.band }}.json
          retention-days: 90
          if-no-files-found: error
