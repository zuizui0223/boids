name: v25-D2 original USGS post-result TRUE-vs-FALSE source encoding artifact audit

on:
  push:
    paths:
      - "validation_v25/postoutcome_encoding_audit.py"
      - "validation_v25/test_postoutcome_encoding_audit.py"
      - "docs/V25D_POSTOUTCOME_STRUCTURAL_LEAKAGE_AUDIT_CONTRACT.md"
      - ".github/workflows/v25-postoutcome-encoding-audit.yml"
  pull_request:
    paths:
      - "validation_v25/postoutcome_encoding_audit.py"
      - "validation_v25/test_postoutcome_encoding_audit.py"
      - "docs/V25D_POSTOUTCOME_STRUCTURAL_LEAKAGE_AUDIT_CONTRACT.md"
      - ".github/workflows/v25-postoutcome-encoding-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  true-used-vs-aggregated-false-encoding:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source numeric reader
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2,<3"
      - name: Test no-training negative and positive structural controls
        env:
          PYTHONPATH: validation_v25
          OPENBLAS_NUM_THREADS: "1"
        run: python -m unittest discover -s validation_v25 -p 'test_postoutcome_encoding_audit.py' -v
      - name: Download actual original USGS MD5-pinned CSV and score only its data-encoding rules
        env:
          PYTHONPATH: validation_v25
          OPENBLAS_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          python validation_v25/postoutcome_encoding_audit.py --out validation_v25/results/source_encoding_postoutcome_audit_v25D2.json
      - name: Verify every original pair and preserve original v25-D1 result without refitting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("validation_v25/results/source_encoding_postoutcome_audit_v25D2.json").read_text())
          assert d["status"]=="POSTOUTCOME_ORIGINAL_USED_AVAIL_PROFILE_ENCODING_DIAGNOSTIC"
          assert d["source_pairs"]==190289
          assert d["source_birdyear_tokens"]==493
          assert d["original_file_receipt"]["sha256"]=="1a5c2342f9df4c70f170741c14b92b5146f0558f29fd593307768a228b82ca15"
          assert d["source_future_locations_or_behavioral_choice_effect_model_fitted"] is False
          assert d["previous_v25D1_original_numbers_changed"] is False
          assert d["this_is_post_outcome_not_confirmatory"] is True
          assert d["original_animal_ID_exact_timestamp_or_habitat_rows_exported"] is False
          for key in ("max_pct","fewer_nonzero","lower_entropy"):
              r=d["three_no_training_structural_rank_controls"][key]
              assert r["source_pairs_true_wins"]+r["source_pairs_false_wins"]+r["source_pairs_tied"]==190289
              assert r["method_has_no_fitted_parameter"] is True
          print("V25D2_POSTOUTCOME_SOURCE_ENCODING_ONLY_COMPLETE")
          PY
      - name: Archive deidentified source structure and three zero-learning controls
        uses: actions/upload-artifact@v4
        with:
          name: boids-v25D2-original-USGS-trivial-structure-leakage-audit
          path: validation_v25/results/source_encoding_postoutcome_audit_v25D2.json
          retention-days: 45
          if-no-files-found: error
