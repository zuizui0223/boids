name: v38 original published WATLAS multi-tide red-knot source admission
on:
  push:
    paths:
      - 'validation_v38/**'
      - 'docs/V38_WATLAS_MULTITIDE_RED_KNOT_SOURCE_GATE.md'
      - '.github/workflows/v38-watlas-multitide-source.yml'
  pull_request:
    paths:
      - 'validation_v38/**'
      - 'docs/V38_WATLAS_MULTITIDE_RED_KNOT_SOURCE_GATE.md'
      - '.github/workflows/v38-watlas-multitide-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-published-multitide-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: validation_v37:validation_v38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Known-truth distinct tideID and dyad-time gates
        run: python -m unittest discover -s validation_v38 -p 'test_*.py' -v
      - name: Open published Figshare 26553446 original source and check real multiple-tide candidate sample
        run: python validation_v38/watlas_multitide_original_source.py --output /tmp/boids_v38_multitide_source.json
      - name: Save original-source checksums and aggregate tideID source coverage only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: red-knot-figshare14-multitide-source-v38
          path: /tmp/boids_v38_multitide_source.json
          retention-days: 90
