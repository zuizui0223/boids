name: v83 corrected 2021 Wadden 2008–2012 ecotope v2 original GPKG source gate
on:
  push:
    paths:
      - 'validation_v83/**'
      - 'docs/V83_FROZEN_2008_2012_ECOTOPE_V2_SOURCE_AND_TIDAL_FLAT_MASK.md'
      - '.github/workflows/v83-real-corrected-v2-wadden-ecotope-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authentic_corrected_source_and_littoral_mask_availability:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONPATH: validation_v83
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native CRS source mapping dependency and test corrected v2 source contract
        run: |
          python -m pip install 'pyproj==3.7.1'
          python -m unittest discover -s validation_v83 -p 'test_*.py' -v
      - name: Discover original Mendeley corrected v2 published GeoPackage and audit native tidal ecotope classes
        run: |
          python -u validation_v83/corrected_ecotope_v2_source_audit.py --output /tmp/v83-corrected-Wadden-2021-v2-ecotope-GPKG-source-audit.json
      - name: Release only publisher source metadata, littoral code map and source admission or clear API blockage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v83-original-corrected-2021-v2-Wadden-littoral-ecotope-source
          path: /tmp/v83-corrected-Wadden-2021-v2-ecotope-GPKG-source-audit.json
          if-no-files-found: error
          retention-days: 90
