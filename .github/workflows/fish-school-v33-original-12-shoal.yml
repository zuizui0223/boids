name: Fish-school v33 original 84 trial 12 shoal local3 versus far3 and assignment surrogate
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths: ['.github/workflows/fish-school-v33-original-12-shoal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-all-84-local-velocity-map:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed original EIDC source and Ridge numerical stack
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - name: Eight known-truth source identity/velocity-to-position invariance tests
        run: python -m unittest discover -s validation_fish_school_v33 -p 'test_*.py' -v
      - name: Verify immutable original 84-to-12 author map and v33 source model
        run: |
          test "$(git hash-object docs/v31_verification/EIDC_84_ORIGINAL_FILES_TO_12_AUTHOR_SHOALS_VERIFIED.json)" = "57ea77c604414cb484f4abd1dd6637eecb2fdf90"
          python - <<'PY'
          from validation_fish_school_v32.stickleback_12_shoal import verify_crosswalk_bytes
          from validation_fish_school_v33.neighbor_panels import PANELS
          x=verify_crosswalk_bytes()
          assert len(x)==84 and len(set(x.values()))==12
          assert len(PANELS)==6
          print("V33_ORIGINAL_84_12_SHOALS_SOURCE_IDENTITY_GATE")
          PY
      - name: Reauthenticate all 84 original EIDC source trials, 12 complete biological shoal holdouts
        run: python -m validation_fish_school_v33.stickleback_neighbor_source
      - name: Enforce original v32 12-shoal G/global exact replay and source-safe local assignment results
        run: |
          python - <<'PY'
          import json,math
          p='validation_fish_school_v33/results/stickleback_84_trials_near_far_rotated_12_shoals.json'
          r=json.load(open(p))
          assert r.get("status")=="V33_ORIGINAL_84_RECORDINGS_12_SHOALS_LOCAL_VERSUS_GLOBAL_HOLDOUT",r
          assert r.get("n_original_EIDC_trial_files")==84
          assert r.get("n_original_biological_shoal_holdouts")==12
          assert r.get("original_trajectory_and_future_Y_time_series_redistributed") is False
          assert r.get("fish_origin_acoustics_or_causal_social_influence_identified") is False
          assert len(r.get("original_true_shoal_holdout_records",[]))==12
          assert sum(z["n_source_original_heldout_trials"] for z in r["original_true_shoal_holdout_records"])==84
          assert all(z["train_and_test_biological_shoal_overlap"] is False for z in r["original_true_shoal_holdout_records"])
          for h in ("short","delayed"):
              vals=r["source_original_group_result"][h]
              assert vals["original_v32_global_group_effect_numerically_replayed"] is True
              assert len(vals["original_twelve_shoal_equal_MSE"])==6
              assert len(vals["prespecified_group_fold_differences"])==5
              assert all(math.isfinite(v) for v in vals["original_twelve_shoal_equal_MSE"].values())
          print("V33_ORIGINAL_84_12_GROUP_LOO_GGLOBAL_REPLAY_AND_LOCAL_DIAGNOSTICS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boids-v33-original-84-fish-trials-12-shoals-local-far-rotated
          path: validation_fish_school_v33/results/stickleback_84_trials_near_far_rotated_12_shoals.json
          retention-days: 30
          if-no-files-found: error
