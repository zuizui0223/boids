name: v153 NOAA verified 2018-23 reference-gauge source availability for original fish hours
on:
  push:
    branches: ["research/v153-*"]
  pull_request:
    paths:
      - "validation_v153/**"
      - "docs/V153*"
      - ".github/workflows/v153-noaa-source-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_original_gauge_source_hours:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original XLS and solar source dependencies
        run: python -m pip install xlrd==2.0.2 astral==3.2
      - name: Synthetic known-truth source gauge identity/time parser
        run: python -m unittest discover -s validation_v153 -p 'test_*.py' -v
      - name: Reacquire original 60 XLS and observed NOAA full UTC-years, source coverage only
        run: python validation_v153/noaa_source_gate.py --check
      - name: Upload complete source-only coverage receipt, no raw fish/gauge hours
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v153-gauge-real-source-only-coverage
          path: validation_v153/results/noaa_verified_tide_source_admission_v153.json
          if-no-files-found: warn
