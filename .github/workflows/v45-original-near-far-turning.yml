name: v45 original focal turning toward NEAR vs FAR past wild bird directions

on:
  pull_request:
    paths:
      - "docs/V45_ORIGINAL_TURN_TOWARD_NEIGHBOR_PROTOCOL.md"
      - "validation_v45/**"
      - ".github/workflows/v45-original-near-far-turning.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-wild-turning-after-full-v43-v44-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    env:
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Original standard numerical dependency
        run: python -m pip install "numpy>=1.26,<3"
      - name: Known truth ten tests without reading original animal GPS or astronomical tides
        env:
          PYTHONPATH: validation_v45
        run: python -m unittest discover -s validation_v45 -p "test_*.py" -v
      - name: Verify full v41-v44 source and observed numerical receipts then test actual focal turning and sham
        env:
          PYTHONPATH: validation_v45
        run: python validation_v45/turning_convergence.py --out validation_v45/results/original_near_far_turning_convergence_v45.json
      - name: Archive only original source-safe matched bird summary and source gates
        uses: actions/upload-artifact@v4
        with:
          name: boids-v45-original-focal-turn-convergence-source-replay
          path: validation_v45/results/original_near_far_turning_convergence_v45.json
          if-no-files-found: error
          retention-days: 45
