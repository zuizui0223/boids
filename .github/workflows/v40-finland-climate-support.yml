name: v40 nonconfirmatory Finnish bat regional thermal support audit after frozen v39
on:
  push:
    paths:
      - "docs/V40_FINLAND_THERMAL_REGION_SUPPORT_DIAGNOSTIC_FREEZE.md"
      - "validation_v40/**"
      - ".github/workflows/v40-finland-climate-support.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed source reader dependencies
        run: python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.5,<2"
      - name: Synthetic tests showing original response outcomes do not affect support statistic
        env:
          PYTHONPATH: validation_v38:validation_v39:validation_v40
        run: python -m unittest discover -s validation_v40 -p "test_finland_climate_support.py" -v
      - name: Reverify source original and measure fixed regional weather overlap without bat model
        env:
          PYTHONPATH: validation_v38:validation_v39:validation_v40
          PYTHONUNBUFFERED: "1"
        run: python validation_v40/finland_climate_support.py --out validation_v40/results/finland_region_climate_support_v40.json
      - name: Enforce post-outcome, descriptive-only interpretation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path('validation_v40/results/finland_region_climate_support_v40.json').read_text())
          assert z['status']=='POST_OUTCOME_DESCRIPTIVE_SUPPORT_ONLY'
          assert z['nighttime_activity_model_refitted'] is False
          assert z['new_pvalue_or_ecological_effect_inferred'] is False
          assert z['per_event_weather_or_activity_values_exported'] is False
          assert z['original_valid_nights']==4208
          print('V40_DESCRIPTIVE_SUPPORT_NO_MODEL_RESCUE')
          PY
      - name: Archive summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boids-v40-finnish-region-climate-support-only
          path: validation_v40/results/finland_region_climate_support_v40.json
          if-no-files-found: ignore
          retention-days: 45
