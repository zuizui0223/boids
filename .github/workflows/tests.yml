name: Regression tests
on:
  push:
    paths:
      - 'boids3d_empirical_v4/**'
      - 'validation_v5/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'boids3d_empirical_v4/**'
      - 'validation_v5/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Legacy Boids and niche tests (24)
        working-directory: boids3d_empirical_v4
        run: python -m unittest discover -s boids3d_research -p 'test_*.py' -v
      - name: Observed-data methods tests (4)
        working-directory: boids3d_empirical_v4
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Known-truth GPS altitude-error identifiability tests (6)
        run: PYTHONPATH=boids3d_empirical_v4:validation_v5 python -m unittest discover -s validation_v5 -p 'test_*.py' -v
