name: v102 recover true UHSLC original 2018 eight-band year by re-sharding only fixed 2019 N00 source IDs
on:
  push:
    paths:
      - 'validation_v102/**'
      - 'docs/V102_FROZEN_2018_ORIGINAL_SOURCE_TRANSPORT_SHARD_RECOVERY.md'
      - '.github/workflows/v102-2018-original-n00-source-transport-rescue.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v102_original_2018_N00_native_immutable_source_shards:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: validation_v89:validation_v92:validation_v93:validation_v94:validation_v95:validation_v96:validation_v97:validation_v98:validation_v99:validation_v100:validation_v101:validation_v102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native astronomical and original UHSLC numerical science dependencies
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2'
      - name: Test exact original 22 source ID modulo-three non-overlapping partition and source fail protections
        run: python -m unittest discover -s validation_v102 -p 'test_*.py' -v
      - name: Retrieve identical originally authenticated 2019 UHSLC 22-station N00 source frame
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42616065580 --repo zuizui0223/boids --name v94-2019-original-UHSLC-PHYSICAL-BAND-N_00_15 --dir /tmp/v94
          test -s /tmp/v94/v94-2019-original-source-N_00_15.json
      - name: Recover only fixed UID modulo-three subset with original UNCHANGED v97 native 2018 waterlevel QC/time/solar estimand
        run: |
          python -u validation_v102/shard_fixed_original_2018_N00.py --original-v94-N00-json /tmp/v94/v94-2019-original-source-N_00_15.json --shard ${{ matrix.shard }} --output /tmp/v102-shard-N_00_15-${{ matrix.shard }}.json
      - name: Publish original source fixed shard, including all invalid and transport failures with 2018 no-body effects
        uses: actions/upload-artifact@v4
        with:
          name: v102-genuine-2018-N00-shard-${{ matrix.shard }}
          path: /tmp/v102-shard-N_00_15-${{ matrix.shard }}.json
          retention-days: 90
          if-no-files-found: error
  v102_reassemble_all_original_8_source_bands_without_selection:
    needs: v102_original_2018_N00_native_immutable_source_shards
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: validation_v89:validation_v92:validation_v93:validation_v94:validation_v95:validation_v96:validation_v97:validation_v98:validation_v99:validation_v100:validation_v101:validation_v102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install required scientific packages for source identity verification
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2'
      - name: Test union source identity, inclusion of transport failures and original previous 7 scientific source units
        run: python -m unittest discover -s validation_v102 -p 'test_*.py' -v
      - name: Fetch all 3 original same-run 2018 N00 source-only frozen UID shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo zuizui0223/boids --pattern 'v102-genuine-2018-N00-shard-*' --dir /tmp/v102shards
          test "$(find /tmp/v102shards -name 'v102-shard-N_00_15-*.json' | wc -l)" -eq 3
      - name: Reuse and preserve all seven source-complete band results from cancelled original v97 2018 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42729101678 --repo zuizui0223/boids --pattern 'v97-2018-TRUE-UHSLC-HOURLY-TIDE-SOLAR-BAND-*' --dir /tmp/v97original7
          test "$(find /tmp/v97original7 -name 'v97-original-UHSLC-2018-*.json' | wc -l)" -eq 7
      - name: Verify original genuine 2019 22 IDs once, and reassemble eight true 2018 source-only frame JSON files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42616065580 --repo zuizui0223/boids --name v94-2019-original-UHSLC-PHYSICAL-BAND-N_00_15 --dir /tmp/v94
          python -u validation_v102/merge_2018_original_eight_bands.py --source-shards-dir /tmp/v102shards --original-seven-v97-dir /tmp/v97original7 --original-v94-N00-json /tmp/v94/v94-2019-original-source-N_00_15.json --output-dir /tmp/v102-8band
          test "$(find /tmp/v102-8band -name 'v97-original-UHSLC-2018-*.json' | wc -l)" -eq 8
      - name: Preserve complete source and transport provenance for separate v98 external-year prediction after source gate
        uses: actions/upload-artifact@v4
        with:
          name: v102-2018-UHSLC-8-original-source-bands-REASSEMBLED
          path: /tmp/v102-8band/v97-original-UHSLC-2018-*.json
          retention-days: 90
          if-no-files-found: error
