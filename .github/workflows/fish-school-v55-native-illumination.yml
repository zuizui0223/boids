name: Fish-school v55 archive-native illumination trials
on:
  pull_request:
    branches: [research/fish-independent-mechanism-v53-20261125]
    paths: ['validation_fish_school_v55/**', '.github/workflows/fish-school-v55-native-illumination.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-illumination:
    if: github.head_ref == 'research/visual-channel-triad-v54-20261125' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - run: |
          git clone --depth=1 --branch v1.0.0 https://github.com/swarmintelligencelab/IntermittentExploration.git external_intermit
          test "$(git -C external_intermit rev-parse HEAD)" = 2eb7fdd4172fff870224b7cbc4d7bdb086b5fbf0
          gh api /repos/zuizui0223/boids/actions/artifacts/15007229391/zip > v54-schema-diagnostic.zip
      - name: Authenticate all 58 sources and score full archive and fixed first/last duration sensitivities
        run: python -m validation_fish_school_v55.native_illumination --source external_intermit --diagnostic v54-schema-diagnostic.zip --out validation_fish_school_v55/results/native_illumination.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v55-archive-native-illumination
          path: validation_fish_school_v55/results/native_illumination.json
          if-no-files-found: error
          retention-days: 30
