name: bat 2024 original Molossus acoustic-density prey capture cross-validation
on:
  push:
    branches: ["prospective/bat-acoustic-game-no-new-measurements-v1"]
    paths:
      - "theory/bat_acoustic_game/MOLOSSUS_2024_LEAVE_BAT_OUT_CAPTURE_PREOUTPUT_V1.md"
      - "theory/bat_acoustic_game/molossus_2024_source_capture_LOBO_v1.py"
      - "theory/bat_acoustic_game/test_molossus_2024_source_capture_LOBO_v1.py"
      - ".github/workflows/bat-molossus-2024-capture-LOBO-v1.yml"
  workflow_dispatch:
jobs:
  original-molossus-bat-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theory/bat_acoustic_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3
      - name: Validate original-source capture math and bat independence on invented-only rows
        run: python -m unittest test_molossus_2024_source_capture_LOBO_v1 -v
      - name: Read authenticated original PNAS supplementary XLSX and evaluate bat-holdout M0 vs M1 vs M2
        run: python molossus_2024_source_capture_LOBO_v1.py
      - name: Enforce original source and no-rehost boundaries
        run: |
          python - <<'PY'
          import json
          a=json.load(open("MOLOSSUS_2024_CAPTURE_BAT_HOLDOUT_RESULT_V1.json"))
          assert a["schema"]==1
          assert not a["new_bat_measurements"]
          assert not a["original_bat_IDs_or_original_rows_exported"]
          if a["status"].startswith("STOP"):
              print("STOP_PNAS_ORIGINAL_SOURCE_OR_ADMISSION",a.get("error"))
          else:
              assert a["source_original_xlsx_sha256"]=="92acbc36cce42028bfd5a07ad1ec8aa8062121575d6d665dc7392b47222f562d"
              print("ORIGINAL_BATS",a["source_meta"]["source_individual_bat_ID_count"])
              print("BIOLOGICAL_FOLDS",a["source_heldout_bat_evaluation"]["original_bat_independent_fold_count"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-Molossus2024-10bat-source-capture-holdout-v1
          path: theory/bat_acoustic_game/MOLOSSUS_2024_CAPTURE_BAT_HOLDOUT_RESULT_V1.json
          retention-days: 30
