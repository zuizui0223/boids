name: Fish-school v59 heldout closed-loop rollout
on:
  pull_request:
    branches: [research/illumination-shared-rules-v58-20261126]
    paths: ['validation_fish_school_v59/**', '.github/workflows/fish-school-v59-rollout.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rollout:
    if: github.head_ref == 'research/illumination-rollout-v59-20261126' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - name: Reacquire pinned original study and heldout score artifacts
        run: |
          git clone --depth=1 --branch v1.0.0 https://github.com/swarmintelligencelab/IntermittentExploration.git external_intermit
          test "$(git -C external_intermit rev-parse HEAD)" = 2eb7fdd4172fff870224b7cbc4d7bdb086b5fbf0
          gh api /repos/zuizui0223/boids/actions/artifacts/15007229391/zip > v54-schema-diagnostic.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/15008044634/zip > v55-illumination.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/15071223342/zip > v58-selective.zip
      - name: Replay v58 base predictions and run the frozen 2-5-10 second simulations
        run: python -m validation_fish_school_v59.closed_loop_rollout --source external_intermit --diagnostic v54-schema-diagnostic.zip --v55 v55-illumination.zip --v58 v58-selective.zip --out validation_fish_school_v59/results/rollout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v59-original-heldout-closed-loop
          path: validation_fish_school_v59/results/rollout.json
          if-no-files-found: error
          retention-days: 30
