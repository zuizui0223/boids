name: v33 original RWS astronomical tide incremental duck-like movement forecast
on:
  pull_request:
    paths:
      - "validation_v33/tidal_forecast.py"
      - "validation_v33/test_tidal_forecast.py"
      - "validation_v33/results/oystercatcher_tide_forecast_v33.json"
      - ".github/workflows/v33-astronomical-tide-forecast.yml"
      - "docs/V33C_FIXED_TIDAL_INCREMENT_FORECAST.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tide-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Existing numerical dependency
        run: python -m pip install "numpy>=1.26,<3"
      - name: Test exact UTC and source time/no-leakage on invented examples before tide outcomes
        env:
          PYTHONPATH: validation_v33
        run: python -m unittest discover -s validation_v33 -p 'test_tidal_forecast.py' -v
      - name: RWS all seven tide-year source and unchanged v32 GPS original replay
        run: python validation_v33/tidal_forecast.py --out validation_v33/results/oystercatcher_tide_forecast_v33.json
      - name: Aggregate-only verified original tide/GPS model results
        uses: actions/upload-artifact@v4
        with:
          name: boids-v33-Schiermonnikoog-original-astronomical-tides
          path: validation_v33/results/oystercatcher_tide_forecast_v33.json
          if-no-files-found: error
          retention-days: 45
