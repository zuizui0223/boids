name: bat echo masking availability versus moving target exact memory frontier
on:
  push:
    branches: ["prospective/bat-acoustic-game-no-new-measurements-v1"]
    paths:
      - "theory/bat_acoustic_game/BAT_ECHO_MASKING_AVAILABILITY_PREOUTPUT_2026_11_07.md"
      - "theory/bat_acoustic_game/bat_echo_masking_availability_v1.py"
      - "theory/bat_acoustic_game/test_bat_echo_masking_availability_v1.py"
      - ".github/workflows/bat-echo-masking-availability-v1.yml"
  workflow_dispatch:
jobs:
  exact-mask-math:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theory/bat_acoustic_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pinned original math package
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Verify no-echo and mobile-target exact subset identities
        run: python -m unittest test_bat_echo_masking_availability_v1 -v
      - name: Recompute all 240 exact no-new-measurements conditional sensory cases
        run: python bat_echo_masking_availability_v1.py
      - name: Verify no source-only output upgraded into bat empirical claims
        run: |
          python - <<'PY'
          import json
          x=json.load(open("BAT_ECHO_MASKING_AVAILABILITY_V1.json"))
          assert x["schema"]==1 and x["fixed_exact_cases"]==240
          assert not x["new_bat_measurements"]
          assert not x["authentic_MATLAB_model_rerun"]
          assert len(x["worlds"])==24
          assert x["analytic_formula_earlier_all_echoes_recovered"]<1e-10
          print("EXACT_ECHO_AVAILABILITY_FRONTIER_240_SOURCE_MOTIVATED_THEORY_CELLS_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-echo-masking-availability-240-exact-cases-v1
          path: theory/bat_acoustic_game/BAT_ECHO_MASKING_AVAILABILITY_V1.json
          retention-days: 60
