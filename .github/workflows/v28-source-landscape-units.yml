name: v28-C0 source-only original noctule bat wind turbine/roost distance and landcover scale

on:
  push:
    paths:
      - "validation_v28/source_landscape_domain.py"
      - "validation_v28/test_source_landscape_domain.py"
      - "docs/V28_SOURCE_ONLY_TURBINE_LANDCOVER_SCALE_GATE.md"
      - ".github/workflows/v28-source-landscape-units.yml"
  pull_request:
    paths:
      - "validation_v28/source_landscape_domain.py"
      - "validation_v28/test_source_landscape_domain.py"
      - "docs/V28_SOURCE_ONLY_TURBINE_LANDCOVER_SCALE_GATE.md"
      - ".github/workflows/v28-source-landscape-units.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-noctule-source-only-km-and-categories:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only numeric processing
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3'
      - name: Check km distance source assumptions and no response leak
        env:
          PYTHONPATH: validation_v28
        run: python -m unittest discover -s validation_v28 -p 'test_source_landscape_domain.py' -v
      - name: Verify original source MD5 and inspect only all-case global numeric units
        env:
          PYTHONPATH: validation_v28
          PYTHONUNBUFFERED: "1"
        run: |
          python validation_v28/source_landscape_domain.py --out validation_v28/results/noctule_source_landcover_turbine_domain_v28.json
      - name: Honor source-only domain outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("validation_v28/results/noctule_source_landcover_turbine_domain_v28.json").read_text())
          assert d["source_original_integrity"]["independently_computed_sha256"]=="76f92b1442eb4350ee6d83ede83b5e43fda4b9f3997e3fd9a3618a44f2470375"
          assert d["source_ID_and_environmental_response_joint_model_not_fitted"]
          assert d["original_60_bat_107_flight_repeated_history_gate_passed"] is False
          assert d["status"] in ("SOURCE_COVARIATE_DOMAIN_VERIFIED_NO_BAT_PREFERENCE",
                               "NOT_ADMITTED_NUMERIC_OR_CATEGORY_SOURCE_DOMAIN")
          r=d["source_domain_audit"]
          assert r["source_original_used_random_case_label_read"] is False
          assert r["source_effect_or_predictive_model_fitted"] is False
          assert r["source_actual_bat_ID_or_track_ID_read"] is False
          print("V28_BAT_SOURCE_ONLY_ENVIRONMENTAL_SCALE",d["status"])
          PY
      - name: Publish only source-wide numeric domains and original file SHA
        uses: actions/upload-artifact@v4
        with:
          name: boids-v28-noctule-original-environment-domain-no-ecology-effect
          path: validation_v28/results/noctule_source_landcover_turbine_domain_v28.json
          retention-days: 45
