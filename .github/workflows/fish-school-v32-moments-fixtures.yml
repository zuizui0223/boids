name: Fish-school v32 source-free exact Ridge summary backend and 12-original-shoal holdout fixtures
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths: ['.github/workflows/fish-school-v32-moments-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-exact-ridge-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install fixed full-matrix reference sklearn and numpy
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<4'
      - name: Eight source-independent known-truth tests of exact StandardScaler Ridge and 12-group holdout
        run: python -m unittest discover -s validation_fish_school_v32 -p 'test_*.py' -v
      - name: Source-free verified crosswalk immutable original group counts
        run: |
          python - <<'PY'
          from validation_fish_school_v32.stickleback_12_shoal import verify_crosswalk_bytes
          from collections import Counter
          x=verify_crosswalk_bytes()
          assert len(x)==84
          assert sorted(set(x.values()),key=int)==[str(i) for i in range(1,13)]
          assert sorted(Counter(x.values()).values())==[3,3,4,5,5,7,8,8,8,10,11,12]
          assert x['01.txt']=='4' and x['02.txt']=='2' and x['105.txt']=='11'
          print('V32_FROZEN_84_SOURCE_12_GROUP_PROVENANCE_PASS')
          PY
