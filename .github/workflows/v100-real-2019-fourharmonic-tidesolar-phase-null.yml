name: v100 independent harmonic phase expectation vs original 2019 tidal solar physical F correlation
on:
  push:
    paths:
      - 'validation_v100/**'
      - 'docs/V100_FROZEN_HARMONIC_EXPECTATION_VS_OBSERVED_TIDAL_SOLAR_GLOBAL_2019.md'
      - '.github/workflows/v100-real-2019-fourharmonic-tidesolar-phase-null.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v100_real_UHSLC_fourharmonic_physical_null:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: validation_v89:validation_v92:validation_v93:validation_v94:validation_v95:validation_v96:validation_v100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed original astronomy and physical numerical dependencies
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2'
      - name: Verify original astronomical 12h versus 24h known-truth, true solar day support and phase source identity
        run: python -m unittest discover -s validation_v100 -p 'test_*.py' -v
      - name: Fetch ALL immutable original 2019 actual UHSLC gauges with four constituent amplitudes, observed original physical M and original geography
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42616065580 --repo zuizui0223/boids --pattern 'v94-2019-original-UHSLC-PHYSICAL-BAND-*' --dir /tmp/v94
          test "$(find /tmp/v94 -name 'v94-2019-original-source-*.json' | wc -l)" -eq 12
      - name: Evaluate original observed 130 coast F-M versus same four-real-amplitude tide physics with 32 phase-randomized surrogate coasts
        run: |
          python -u validation_v100/harmonic_physics_null.py --source-dir /tmp/v94 --output /tmp/v100-original-UHSLC-harmonic-phase-expectation.json
      - name: Publish physical harmonic phase null and source coverage audit, NOT behavioral or biological ecology
        uses: actions/upload-artifact@v4
        with:
          name: v100-ORIGINAL-2019-UHSLC-HARMONIC-EXPECTED-vs-OBSERVED-F-M-PHYSICS
          path: /tmp/v100-original-UHSLC-harmonic-phase-expectation.json
          retention-days: 90
          if-no-files-found: error
