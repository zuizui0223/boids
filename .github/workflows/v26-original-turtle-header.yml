name: v26 independent USGS marine turtle original 45MB source MD5 and column gate

on:
  push:
    paths:
      - "validation_v26/turtle_header_gate.py"
      - "validation_v26/test_turtle_header_gate.py"
      - "docs/V26_TURTLE_ORIGINAL_GPS_STEP_HEADER_PIN.md"
      - ".github/workflows/v26-original-turtle-header.yml"
  pull_request:
    paths:
      - "validation_v26/turtle_header_gate.py"
      - "validation_v26/test_turtle_header_gate.py"
      - "docs/V26_TURTLE_ORIGINAL_GPS_STEP_HEADER_PIN.md"
      - ".github/workflows/v26-original-turtle-header.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-turtle-step-source-header:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline original source digest/header and no-row tests
        env:
          PYTHONPATH: validation_v26
        run: python -m unittest discover -s validation_v26 -p 'test_turtle_header_gate.py' -v
      - name: Download original USGS 45.67MB marine turtle CSV, full MD5/SHA256 and only field names
        env:
          PYTHONPATH: validation_v26
          PYTHONUNBUFFERED: "1"
        run: |
          python validation_v26/turtle_header_gate.py --out validation_v26/results/turtle_original_header_v26.json
      - name: Honor source-hard stop or original full hash, no animal endpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("validation_v26/results/turtle_original_header_v26.json").read_text())
          assert d["source_DOI"]=="10.5066/P9UZU4GG"
          assert d["source_item_id"]=="5faab074d34eb413d5df1f41"
          assert d["original_telemetry_or_environment_values_used"] is False
          assert d["all_prior_v13_to_v25_results_unchanged"]
          assert d["source_status"] in (
            "ORIGINAL_USGS_TURTLE_HEADER_ONLY_VERIFIED",
            "NOT_ADMITTED_ORIGINAL_TURTLE_BYTES_OR_HEADER")
          if d["source_status"]=="ORIGINAL_USGS_TURTLE_HEADER_ONLY_VERIFIED":
              assert d["original_file_hashes"]["exact_source_bytes"]==45669515
              assert d["original_file_hashes"]["original_md5"]=="5c5f25398720a663ae332097b49bf740"
              assert len(d["original_file_hashes"]["independently_computed_sha256"])==64
              assert d["header_and_physical_size"]["source_step_case_labels_or_group_counts_read"] is False
          print("V26_TURTLE_SOURCE_ONLY",d["source_status"])
          PY
      - name: Archive original MD5/SHA256 source and only column headers, not turtle data
        uses: actions/upload-artifact@v4
        with:
          name: boids-v26-original-USGS-turtle-step-header-only
          path: validation_v26/results/turtle_original_header_v26.json
          retention-days: 45
          if-no-files-found: error
