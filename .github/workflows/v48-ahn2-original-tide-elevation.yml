name: v48 original AHN2 destination terrain altitude versus true and previous-year tide phase
on:
  push:
    paths:
      - 'validation_v48/**'
      - 'docs/V48_FROZEN_NEXT_DESTINATION_ELEVATION_TIDE.md'
      - '.github/workflows/v48-ahn2-original-tide-elevation.yml'
  pull_request:
    paths:
      - 'validation_v48/**'
      - 'docs/V48_FROZEN_NEXT_DESTINATION_ELEVATION_TIDE.md'
      - '.github/workflows/v48-ahn2-original-tide-elevation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_verified_2011_original_destination_z:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: [schiermonnikoog, ameland]
    env:
      PYTHONPATH: validation_v29:validation_v30:validation_v31:validation_v33:validation_v34:validation_v39:validation_v40:validation_v41:validation_v45:validation_v46:validation_v47:validation_v48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original tide model and historical DTM numerical/coordinate tools
        run: python -m pip install -r requirements.txt 'rasterio>=1.3,<2' 'pyproj>=3.5,<4'
      - name: Test no water-defined source elevation target, source GPS replay, historical placebo
        run: python -m unittest discover -s validation_v48 -p 'test_*.py' -v
      - name: Test 2010 original training and 2011 original GPS next-elevation year holdout
        env:
          SITE: ${{ matrix.site }}
        run: |
          python validation_v48/ahn2_destination_z_tide_prediction.py --site "$SITE" --output "/tmp/v48-ahn2-${SITE}-elevation.json"
      - name: Save only original source SHA receipts and aggregate next-elevation tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: original-v48-2011-AHN2-destination-tide-${{ matrix.site }}
          path: /tmp/v48-ahn2-*-elevation.json
          retention-days: 90
