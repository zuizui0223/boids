name: Fish-school v41 independent original 84/12 group numerical audit from authenticated source-safe artifact
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths: ['.github/workflows/fish-school-v41-independent-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  independently-recompute-original-group-v41:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install only NumPy for independent source-safe MSE/paired bootstrap calculation
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Fetch original v41 verified 84-track 12-author-shoal results ONLY, not fish XY time series
        run: |
          mkdir -p /tmp/original-v41-reaggregation
          gh run download 45390039756 \
            --repo zuizui0223/boids \
            --name boids-v41-original-84-12-shoals-2x2-speed-turn-conditional-neighbor-prediction \
            --dir /tmp/original-v41-reaggregation
          echo '967a323afaf64ce33bb87ac5fffdd69497e1f80f5a3bcd88aea02631d0f4fee8  /tmp/original-v41-reaggregation/2021_original_84_fish_videos_12_shoals_joint_speed_turn_moderation.json' | sha256sum --check --status
      - name: Independent ORIGINAL true-12-shoal group MSE ratios, five conditional contrasts and exact 5000 group bootstraps
        run: |
          python -m validation_fish_school_v41.independent_group_audit \
            --original-result /tmp/original-v41-reaggregation/2021_original_84_fish_videos_12_shoals_joint_speed_turn_moderation.json \
            --audit-out validation_fish_school_v41/results/independent_original_84_12_2x2_source_audit.json
      - name: Require original 84-record 12-group genuine ID and no invented fish speed manipulation
        run: |
          python - <<'PY'
          import json,math
          d=json.load(open('validation_fish_school_v41/results/independent_original_84_12_2x2_source_audit.json'))
          assert d["status"]=="V41_INDEPENDENT_POSTV40_2x2_ORIGINAL_12_BIOLOGICAL_SHOAL_NUMERICAL_AUDIT_PASS"
          assert d["source_original_84_trial_files"]==84
          assert d["source_original_12_heldout_biological_shoals"]==12
          assert d["new_experiment_or_causal_speed_turn_effect_measured"] is False
          assert d["original_fish_XY_velocities_or_individual_audio_republished"] is False
          assert set(d["by_future_horizon"])=={"short","delayed"}
          for h,z in d["by_future_horizon"].items():
              assert len(z['four_original_speed_turn_cells_percent_prediction_gain'])==4
              assert len(z['original_shoal_joint_conditional_deltas'])==5
              assert all(len(v)==2 for v in z['original_shoal_joint_conditional_deltas'].values())
          print('V41_INDEPENDENT_EXACT_ORIGINAL_84_12_SHOAL_2x2_CONDITIONAL_BOOTSTRAP_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boids-v41-independent-original-84-12-shoal-2x2-numerical-audit
          path: validation_fish_school_v41/results/independent_original_84_12_2x2_source_audit.json
          retention-days: 30
          if-no-files-found: error
