name: v106 genuine GIC tidal-wetland 2019 pixel buffers of eight source-selected UHSLC gauge sites
on:
  push:
    paths:
      - 'validation_v106/**'
      - 'docs/V106_FROZEN_ORIGINAL_2019_STATION_GIC_PROXIMITY_PILOT.md'
      - '.github/workflows/v106-real-2019-gauge-10km-wetland-geodesic.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v106_2019_true_GIC_native_10km_wetland_source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        band: [N_00_15, N_15_30, N_30_45, N_45_60, N_60_75, S_00_15, S_30_45, S_45_60]
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: validation_v89:validation_v92:validation_v93:validation_v94:validation_v95:validation_v105:validation_v106
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rasterio/pyproj and original UHSLC source dependencies
        run: python -m pip install 'numpy==1.26.4' 'rasterio==1.4.3' 'pyproj==3.7.1' 'astral==3.2'
      - name: Check source-only 8-station UID policy, tile-grid routing and real valid raster pixel masking
        run: python -m unittest discover -s validation_v106 -p 'test_*.py' -v
      - name: Obtain 12 source-original 2019 UHSLC eligible gauge site panels, no effect or habitat selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42616065580 --repo zuizui0223/boids --pattern 'v94-2019-original-UHSLC-PHYSICAL-BAND-*' --dir /tmp/v94
          test "$(find /tmp/v94 -name 'v94-2019-original-source-*.json' | wc -l)" -eq 12
      - name: Obtain original v105 MD5-verified GIC 2019 first tile CRS affine and native unit source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42737124600 --repo zuizui0223/boids --name v105-REAL-ORIGINAL-GIC2019-TWPROBEND-FIRST-TILE-GEOREF-QA --dir /tmp/v105
          test -s /tmp/v105/v105-original-GIC2019-first-tile-native-georef-QA.json
      - name: Derive original fixed gauge's native 2019 tidal-wetland GCS tile, verify publisher MD5, geodesic 10km real RF pixels
        run: |
          python -u validation_v106/gic2019_real_10km_gauge_buffer.py --v94-source-dir /tmp/v94 --v105-original-geo-audit /tmp/v105/v105-original-GIC2019-first-tile-native-georef-QA.json --band '${{ matrix.band }}' --output '/tmp/v106-genuine-2019-GIC-gauge-${{ matrix.band }}.json'
      - name: Upload native GCS validation, source access/missing tile statuses and buffer RF probability QA (not raw map/animal data)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v106-GENUINE-2019-GIC-WETLAND-10km-BAND-${{ matrix.band }}
          path: /tmp/v106-genuine-2019-GIC-gauge-${{ matrix.band }}.json
          retention-days: 90
          if-no-files-found: error
