name: Fish-school v22 tetra original current vs 2sec-stale global state
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths:
      - 'validation_fish_school_v22/**'
      - 'docs/V22_CONTEMPORANEOUS_COLLECTIVE_VELOCITY_FREEZE.md'
      - '.github/workflows/fish-school-v22-tetra.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tetra-original:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original source numerical prerequisites
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2' 'pandas>=2.2,<4'
      - name: Run eight independent source-free current/stale fixtures
        run: python -m unittest discover -s validation_fish_school_v22 -p 'test_*.py' -v
      - name: Reacquire six original verified Puy recordings and score frozen v22 comparisons
        run: python validation_fish_school_v22/tetra.py
      - name: Require empirical source, prior numerical replay, and complete observed scores
        run: |
          python - <<'PY'
          import json
          p='validation_fish_school_v22/results/tetra_current_vs_stale.json'
          o=json.load(open(p))
          assert o.get('status')=='OBSERVED_RETROSPECTIVE_FISH_MOVEMENT_V22_SCORED',o
          assert o.get('frozen_prior_mse_replay')=='PASS'
          assert len(o.get('results',[]))==6
          assert o.get('original_provider_MD5_verified') is True
          print('SCIENTIFIC_ORIGINAL_SOURCE_AND_REPLAY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fish-school-v22-original-tetra-temporal-specificity
          path: validation_fish_school_v22/results/tetra_current_vs_stale.json
          retention-days: 30
          if-no-files-found: error
