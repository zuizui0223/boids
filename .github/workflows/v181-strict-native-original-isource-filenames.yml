name: v181 genuine 2018 2019 GPS native isource original filenames with internal spaces, exploratory provenance audit
on:
  push:
    branches: ["research/v181-*"]
  pull_request:
    paths:
      - "validation_v181/**"
      - "docs/V181*"
      - ".github/workflows/v181-strict-native-original-isource-filenames.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source_provenance_only:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: validation_v109:validation_v110:validation_v111:validation_v125:validation_v126:validation_v127:validation_v128:validation_v129:validation_v130:validation_v165:validation_v166:validation_v167:validation_v168:validation_v173:validation_v174:validation_v175:validation_v176:validation_v177:validation_v178:validation_v181
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin source audit packages
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2' 'netCDF4==1.7.2' 'pyproj==3.7.1'
      - name: Syntax and no future-source name synthetic controls
        run: |
          python -m py_compile validation_v181/strict_native_source_extension_filename_audit.py
          python -m unittest discover -s validation_v181 -p 'test_*.py' -v
      - name: Retrieve only previously verified original 2018 2019 SOURCE receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v128 /tmp/v129 /tmp/v126gps /tmp/v126rws /tmp/v127
          gh run download 43463270204 --repo zuizui0223/boids --name v128-ORIGINAL-2018-VLIELAND-ACC-GPS-JUNESEP-2019-BIRD-OVERLAP-SOURCE-ONLY --dir /tmp/v128
          gh run download 43579877533 --repo zuizui0223/boids --name v129-ORIGINAL-2018-VLIELAND-ACC-CLASS-FORAGE-MEASURED-RWS-SOLAR-HISTORICAL-OR-STOP --dir /tmp/v129
          gh run download 43220491868 --repo zuizui0223/boids --name v126-GENUINE-2019-VLIELAND-FORAGE-INACTIVE-GPS-15MIN-25KM-SOURCE --dir /tmp/v126gps
          gh run download 43220491868 --repo zuizui0223/boids --name v126-ORIGINAL-RWS-2019-VLIELAND-HAVEN-MEASURED-TIDE-SOURCE --dir /tmp/v126rws
          gh run download 43461048062 --repo zuizui0223/boids --name v127-ORIGINAL-2019-VLIELAND-ACC-CLASS-FORAGE-RWS-TIDE-SUN-OR-SOURCE-STOP --dir /tmp/v127
          test -s /tmp/v128/v128-original-Vlieland-2018-ACC-GPS-source-only.json
          test -s /tmp/v129/v129-original-2018-Vlieland-ACC-forage-share-true-RWS-tide-sun-historical.json
          test -s /tmp/v126gps/v126-real-2019-Vlieland-forage-inactive-GPS-MD5-15min-source-only.json
          test -s /tmp/v126rws/v126-real-2019-RWS-Vlieland-Haven-10min-original-NAP-source-only.json
          test -s /tmp/v127/v127-original-2019-Vlieland-ACC-forage-share-true-RWS-tide-sun-fourway.json
      - name: Reacquire original source and audit source file origin year without replacing latest DEM cell
        run: |
          python -u validation_v181/strict_native_source_extension_filename_audit.py --v128 /tmp/v128/v128-original-Vlieland-2018-ACC-GPS-source-only.json --v129 /tmp/v129/v129-original-2018-Vlieland-ACC-forage-share-true-RWS-tide-sun-historical.json --v126-gps /tmp/v126gps/v126-real-2019-Vlieland-forage-inactive-GPS-MD5-15min-source-only.json --v126-rws /tmp/v126rws/v126-real-2019-RWS-Vlieland-Haven-10min-original-NAP-source-only.json --v127 /tmp/v127/v127-original-2019-Vlieland-ACC-forage-share-true-RWS-tide-sun-fourway.json --emit
      - name: Publish only year-level source file chronology audit without individual GPS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v181-true-native-DEM-isource-filename-year-GPS-audit
          path: validation_v181/results/real_native_origin_filename_provenance_v181.json
          if-no-files-found: warn
