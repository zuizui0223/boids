name: v105 authentic 2019 GIC first 53MB tiled GeoTIFF source CRS and probability pixel QA
on:
  push:
    paths:
      - 'validation_v105/**'
      - 'docs/V105_FROZEN_GENUINE_INTERTIDAL_WETLAND_TILE_GEOREF_QA.md'
      - '.github/workflows/v105-original-GIC-tile-georeference-QA.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v105_original_2019_GCS_tile_native_georeference:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: validation_v89:validation_v92:validation_v93:validation_v94:validation_v95:validation_v105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rasterio and original source identity calculation dependencies
        run: python -m pip install 'rasterio==1.4.3' 'numpy==1.26.4' 'astral==3.2'
      - name: Known-truth verification of tiny georeferenced/real mask and source identity
        run: python -m unittest discover -s validation_v105 -p 'test_*.py' -v
      - name: Retrieve original fixed 2019 160-gauge UHSLC source geography (all 12 quality complete original bands)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42616065580 --repo zuizui0223/boids --pattern 'v94-2019-original-UHSLC-PHYSICAL-BAND-*' --dir /tmp/v94
          test "$(find /tmp/v94 -name 'v94-2019-original-source-*.json' | wc -l)" -eq 12
      - name: Download exact first original GIC t7 wetland probability TIFF and provider MD5-verify bytes before geospatial CRS and sampled probability values
        run: |
          python -u validation_v105/verify_original_GIC2019_first_tile_pixels.py --v94-original-source-dir /tmp/v94 --output /tmp/v105-original-GIC2019-first-tile-native-georef-QA.json
      - name: Publish native original CRS and selected raster sample QA, never raw 53MB raster and never animal behavior
        uses: actions/upload-artifact@v4
        with:
          name: v105-REAL-ORIGINAL-GIC2019-TWPROBEND-FIRST-TILE-GEOREF-QA
          path: /tmp/v105-original-GIC2019-first-tile-native-georef-QA.json
          if-no-files-found: error
          retention-days: 90
