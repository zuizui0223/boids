name: v177 genuine 2018 2019 bird GPS coverage in historical 2016 native Vlieland DEM pixels
on:
  push:
    branches: ["research/v177-*"]
  pull_request:
    paths:
      - "validation_v177/**"
      - "docs/V177*"
      - ".github/workflows/v177-real-birdGPS-historical-DEM-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  genuine_source_strict_crossyear_transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: validation_v109:validation_v110:validation_v111:validation_v125:validation_v126:validation_v127:validation_v128:validation_v129:validation_v130:validation_v165:validation_v166:validation_v167:validation_v168:validation_v173:validation_v174:validation_v175:validation_v176:validation_v177
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin source verified Dutch projected CRS and NetCDF original native pixels
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2' 'netCDF4==1.7.2' 'pyproj==3.7.1'
      - name: Known truth 20m DEM center versus GPS EPSG:28992 and no missing pixel interpolation fixtures
        run: python -m unittest discover -s validation_v177 -p 'test_*.py' -v
      - name: Fetch only prior cryptographic 2018 and 2019 original-source receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v128 /tmp/v129 /tmp/v126gps /tmp/v126rws /tmp/v127
          gh run download 43463270204 --repo zuizui0223/boids --name v128-ORIGINAL-2018-VLIELAND-ACC-GPS-JUNESEP-2019-BIRD-OVERLAP-SOURCE-ONLY --dir /tmp/v128
          gh run download 43579877533 --repo zuizui0223/boids --name v129-ORIGINAL-2018-VLIELAND-ACC-CLASS-FORAGE-MEASURED-RWS-SOLAR-HISTORICAL-OR-STOP --dir /tmp/v129
          gh run download 43220491868 --repo zuizui0223/boids --name v126-GENUINE-2019-VLIELAND-FORAGE-INACTIVE-GPS-15MIN-25KM-SOURCE --dir /tmp/v126gps
          gh run download 43220491868 --repo zuizui0223/boids --name v126-ORIGINAL-RWS-2019-VLIELAND-HAVEN-MEASURED-TIDE-SOURCE --dir /tmp/v126rws
          gh run download 43461048062 --repo zuizui0223/boids --name v127-ORIGINAL-2019-VLIELAND-ACC-CLASS-FORAGE-RWS-TIDE-SUN-OR-SOURCE-STOP --dir /tmp/v127
          test -s /tmp/v128/v128-original-Vlieland-2018-ACC-GPS-source-only.json
          test -s /tmp/v129/v129-original-2018-Vlieland-ACC-forage-share-true-RWS-tide-sun-historical.json
          test -s /tmp/v126gps/v126-real-2019-Vlieland-forage-inactive-GPS-MD5-15min-source-only.json
          test -s /tmp/v126rws/v126-real-2019-RWS-Vlieland-Haven-10min-original-NAP-source-only.json
          test -s /tmp/v127/v127-original-2019-Vlieland-ACC-forage-share-true-RWS-tide-sun-fourway.json
      - name: Reacquire real Zenodo 2018/2019 GPS ACC and RWS, validate native 2016 z/isource masks and aggregate GPS matching only
        run: |
          python -u validation_v177/real_GPS_to_2016_DEM_source_gate.py --v128 /tmp/v128/v128-original-Vlieland-2018-ACC-GPS-source-only.json --v129 /tmp/v129/v129-original-2018-Vlieland-ACC-forage-share-true-RWS-tide-sun-historical.json --v126-gps /tmp/v126gps/v126-real-2019-Vlieland-forage-inactive-GPS-MD5-15min-source-only.json --v126-rws /tmp/v126rws/v126-real-2019-RWS-Vlieland-Haven-10min-original-NAP-source-only.json --v127 /tmp/v127/v127-original-2019-Vlieland-ACC-forage-share-true-RWS-tide-sun-fourway.json --check
      - name: Upload only source-safe 2018/2019 GPS-to-valid-native-2016-cell fractions and original source QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v177-real-Vlieland-birdGPS-historical-2016-DEM-native-z-source-coverage
          path: validation_v177/results/original_birdGPS_2016_dem_source_overlap_v177.json
          if-no-files-found: warn
