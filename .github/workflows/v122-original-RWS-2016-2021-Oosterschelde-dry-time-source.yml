name: v122 original RWS 2016 and 2021 Oosterschelde modelled dry-duration ecotope GeoTIFF and unit source
on:
  push:
    paths:
      - 'validation_v122/**'
      - 'docs/V122_FROZEN_ORIGINAL_2016_2021_OOSTERSCHELDE_DROOGVALDUUR_SOURCE.md'
      - '.github/workflows/v122-original-RWS-2016-2021-Oosterschelde-dry-time-source.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v122_original_RWS_2016_2021_dry_duration_native_source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: '0'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONPATH: validation_v109:validation_v110:validation_v111:validation_v116:validation_v117:validation_v121:validation_v122
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original RWS modelled drying raster GIS/numerical source dependencies
        run: python -m pip install 'numpy==1.26.4' 'rasterio==1.4.3' 'pyproj==3.7.1' 'astral==3.2'
      - name: Native TIFF original geomask and 2016/2021 raw numeric units (not assumed percent) known truths
        run: python -m unittest discover -s validation_v122 -p 'test_*.py' -v
      - name: Retrieve original 2019 RWS DTM 5m public fixed Roggenplaat 441 cell geo and SHA native source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42833186694 --repo zuizui0223/boids --name v116-RWS-2019-TRUE-OOSTERSCHELDE-DTM-5M-2M-NAP-PILOT-SOURCE --dir /tmp/v116
          test -s /tmp/v116/v116-real-RWS-Oosterschelde-2019-DTM-source-geometry-and-NAP-QA.json
      - name: Verify genuine original 2016 and 2021 RWS Oosterschelde drying-duration GeoTIFF and sidecar native units, extract 441 same-original-2019 DTM centers before model agreement claims
        run: |
          python -u validation_v122/original_RWS_2016_2021_Oosterschelde_drying_maps.py --v116-real-2019-source-artifact /tmp/v116/v116-real-RWS-Oosterschelde-2019-DTM-source-geometry-and-NAP-QA.json --output /tmp/v122-RWS-original-2016-2021-model-dry-duration-native-geo-QA.json
      - name: Upload genuine original official ecotope raster source, exact fixed source counts and unit ambiguity; NO bird/source temporal niche estimates
        uses: actions/upload-artifact@v4
        with:
          name: v122-REAL-RWS-ORIGINAL-2016-2021-OOSTERSCHELDE-DRY-DURATION-INDEX-SOURCE
          path: /tmp/v122-RWS-original-2016-2021-model-dry-duration-native-geo-QA.json
          if-no-files-found: error
          retention-days: 90
