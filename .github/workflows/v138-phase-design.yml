name: v138 phase sampling identifiability gate
on:
  push:
    branches: ["research/v138-*"]
  pull_request:
    paths:
      - "validation_v138/**"
      - "docs/V138_TIDAL_SOLAR_PHASE_DESIGN_JA.md"
  workflow_dispatch:
jobs:
  synthetic-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test harmonic phase, normalized information balance and matching effort
        run: python -m unittest discover -s validation_v138 -p 'test_*.py' -v
      - name: Regenerate deterministic phase-grid design and inspect
        run: python validation_v138/phase_design.py
      - name: Upload exact output for source checked review
        uses: actions/upload-artifact@v4
        with:
          name: v138-harmonic-phase-design-grid
          path: validation_v138/results/sampling_design_phase_grid.json
