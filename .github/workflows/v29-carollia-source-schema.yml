name: v29 independent Carollia echolocation/flight source-only MAT schema gate

on:
  push:
    paths:
      - "validation_v29/tunnel_source_schema_audit.py"
      - "validation_v29/test_tunnel_source_schema_audit.py"
      - "docs/BAT_ACTIVE_SENSING_TUNNEL_SOURCE_INVENTORY_V1.json"
      - ".github/workflows/v29-carollia-source-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-original-mat-schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only HDF5 metadata reader
        run: python -m pip install "h5py>=3.9,<5"
      - name: Offline known-truth tests
        env:
          PYTHONPATH: validation_v29
        run: python -m unittest discover -s validation_v29 -p "test_tunnel_source_schema_audit.py" -v
      - name: Obtain exact pinned upstream repo SHA, no upstream scripts executed
        env:
          SOURCE_SHA: 59928a71887d521fec143080b0b187736c046a0e
        run: |
          git clone --quiet --depth=1 --no-checkout https://github.com/00keveland/Tunnel_2026.git "$RUNNER_TEMP/Tunnel_2026"
          git -C "$RUNNER_TEMP/Tunnel_2026" fetch --quiet --depth=1 origin "$SOURCE_SHA"
          git -C "$RUNNER_TEMP/Tunnel_2026" checkout --quiet --detach "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/Tunnel_2026" rev-parse HEAD)" = "$SOURCE_SHA"
          echo "V29_PINNED_UPSTREAM_GIT_SOURCE_COMMIT_VERIFIED=$SOURCE_SHA"
      - name: Verify 30 original Git blobs and HDF5 field shapes without reading animal outcomes
        env:
          PYTHONPATH: validation_v29
          PYTHONUNBUFFERED: "1"
        run: |
          python validation_v29/tunnel_source_schema_audit.py \
            --source-root "$RUNNER_TEMP/Tunnel_2026" \
            --out validation_v29/results/tunnel_source_schema_audit_v29.json
      - name: Enforce source-only inference boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("validation_v29/results/tunnel_source_schema_audit_v29.json")
          d=json.loads(p.read_text())
          assert d["source_trials_listed"]==30
          assert d["original_files_git_blob_verified_n"]==30
          assert d["source_original_numeric_animal_or_sonar_values_read"] is False
          assert d["primary_q_law_admitted"] is False
          assert d["source_level_biological_conclusion"]=="NONE"
          assert d["prior_frozen_batter_and_boids_results_unchanged"] is True
          print("V29_SOURCE_ONLY_NO_PREMATURE_BEHAVIOR_MODEL")
          PY
      - name: Archive metadata-only field shapes, not raw animal arrays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boids-v29-carollia-pinned-30-mat-structure-only
          path: validation_v29/results/tunnel_source_schema_audit_v29.json
          if-no-files-found: ignore
          retention-days: 45
