name: v166 original 2018 Vlieland true 15min bin clock repair then observed state and real RWS
on:
  push:
    branches: ["research/v166-*"]
  pull_request:
    paths:
      - "validation_v166/**"
      - "docs/V166*"
      - ".github/workflows/v166-original-native-15min-tide.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authentic_quarterhour_lag_and_true_tide:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: validation_v109:validation_v110:validation_v111:validation_v125:validation_v126:validation_v127:validation_v128:validation_v129:validation_v130:validation_v165:validation_v166
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned original bird/RWS source dependencies
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2'
      - name: Synthetic source event-vs-native-binned-time correctness tests
        run: python -m unittest discover -s validation_v166 -p 'test_*.py' -v
      - name: Fetch only anonymous original v128 v129 source receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v128 /tmp/v129
          gh run download 43463270204 --repo zuizui0223/boids --name v128-ORIGINAL-2018-VLIELAND-ACC-GPS-JUNESEP-2019-BIRD-OVERLAP-SOURCE-ONLY --dir /tmp/v128
          test -s /tmp/v128/v128-original-Vlieland-2018-ACC-GPS-source-only.json
          gh run download 43579877533 --repo zuizui0223/boids --name v129-ORIGINAL-2018-VLIELAND-ACC-CLASS-FORAGE-MEASURED-RWS-SOLAR-HISTORICAL-OR-STOP --dir /tmp/v129
          test -s /tmp/v129/v129-original-2018-Vlieland-ACC-forage-share-true-RWS-tide-sun-historical.json
      - name: Reacquire true 2018 original tagged ACC/GPS 15min bin and genuine RWS, compare observed previous bin with correct/wrong phase
        run: |
          python -u validation_v166/native_quarterhour_lag_tide.py --v128-source /tmp/v128/v128-original-Vlieland-2018-ACC-GPS-source-only.json --v129-original /tmp/v129/v129-original-2018-Vlieland-ACC-forage-share-true-RWS-tide-sun-historical.json --emit
      - name: Publish source-safe original bin-quality results and weekly model aggregates only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v166-authentic-native-bird-15min-lag-and-RWS-tide-conditional
          path: validation_v166/results/original_true_15min_binned_bird_tide_v166.json
          if-no-files-found: warn
