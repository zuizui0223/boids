name: bat Hase-source gamma IPI waveform/window v2
on:
  push:
    branches: ["prospective/bat-acoustic-game-no-new-measurements-v1"]
    paths:
      - "theory/bat_acoustic_game/source_timing_waveform_v2.py"
      - "theory/bat_acoustic_game/test_source_timing_waveform_v2.py"
      - "theory/bat_acoustic_game/HASE_SOURCE_TIMING_WAVEFORM_V2_PREOUTPUT_CONTRACT.md"
      - ".github/workflows/bat-hase-source-timing-waveform-v2.yml"
  workflow_dispatch:
jobs:
  source-timing-waveform:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theory/bat_acoustic_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned mathematical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Verify timing waveform and opportunity controls
        run: python -m unittest test_source_timing_waveform_v2 -v
      - name: Run pre-output-frozen 4 worlds x 3 pulse-shape family (no bat data)
        run: |
          python source_timing_waveform_v2.py > source_timing_waveform_v2_results.json
          python - <<'PY'
          import json
          x=json.load(open("source_timing_waveform_v2_results.json"))
          assert x["schema"]==2
          assert x["status"]=="SYNTHETIC_SOURCE_INFORMED_WAVEFORM_AND_WINDOW_SENSITIVITY"
          assert x["new_bat_measurements"] is False
          assert x["unverified_source_species_waveform"] is True
          assert x["source_original_2026_group_reproduced"] is False
          assert x["source_original_2020_capture_reproduced"] is False
          assert len(x["worlds"])==12
          print("MAX_QUANTIZATION_ERR",x["quantization_max_err_fixed_fixtures"],
                "FULL_EXACT",x["exact_correlation_fallback_from_lookup_error"])
          for w in x["worlds"]:
              print("SOURCE_CONSTRAINED_WORLD",w["n"],w["scale"],w["waveform"],
                    "pulse_support",w["jar"]["focal_emissions"],
                    "eligible",w["jar"]["eligible_other_bat_pulses"],
                    "TFgap_change",round(w["delta_tf_gap_khz"],6),
                    "possible_lag_matches_per_own_pulse",
                    round(w["baseline"]["lag_per_focal"],5),
                    round(w["jar"]["lag_per_focal"],5),
                    "lag_change",round(w["delta_lag_per_focal"],6),
                    "zero_lag_change",round(w["delta_zero_per_focal"],6))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bat-source-timing-waveform-v2-synthetic
          path: theory/bat_acoustic_game/source_timing_waveform_v2_results.json
          retention-days: 30
