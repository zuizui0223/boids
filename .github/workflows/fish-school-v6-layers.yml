name: Fish-school v6 original six-trial Boids layer decomposition
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths:
      - 'validation_fish_school_v6/**'
      - '.github/workflows/fish-school-v6-layers.yml'
      - 'docs/V6_ORIGINAL_FISH_MOTOR_LAYER_FREEZE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ablations:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - name: Known truth tests for strict nested layer mappings and v5 freeze
        run: python -m unittest discover -s validation_fish_school_v6 -p 'test_v6*.py' -v
      - name: Verify all six original MD5, replay original v5 scores, evaluate G vs F and secondaries
        run: python validation_fish_school_v6/ablate_schooling.py
      - name: Preserve only source-safe aggregate score receipt
        uses: actions/upload-artifact@v4
        with:
          name: fish-school-v6-layer-ablation-real
          path: validation_fish_school_v6/results/observed_fish_motion_ablation.json
          retention-days: 30
