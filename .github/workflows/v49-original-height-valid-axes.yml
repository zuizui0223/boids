name: v49 same AHN2-valid original GPS tide direction vs terrain elevation
on:
  push:
    paths:
      - 'validation_v49/**'
      - 'docs/V49_FROZEN_MATCHED_AHN2_DIRECTION_ELEVATION.md'
      - '.github/workflows/v49-original-height-valid-axes.yml'
  pull_request:
    paths:
      - 'validation_v49/**'
      - 'docs/V49_FROZEN_MATCHED_AHN2_DIRECTION_ELEVATION.md'
      - '.github/workflows/v49-original-height-valid-axes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_C_height_valid_heading_and_terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        site: [schiermonnikoog, ameland]
    env:
      PYTHONPATH: validation_v29:validation_v30:validation_v31:validation_v33:validation_v34:validation_v39:validation_v40:validation_v41:validation_v45:validation_v46:validation_v47:validation_v48:validation_v49
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original numerical movement and georeferenced AHN2 source tools
        run: python -m pip install -r requirements.txt 'rasterio>=1.3,<2' 'pyproj>=3.5,<4'
      - name: Test exact original GPS target, old v41/v48 forecast replay, paired axis uncertainty
        run: python -m unittest discover -s validation_v49 -p 'test_*.py' -v
      - name: Original same source C-height-valid 2010 train 2011 field test of direction and elevation
        env:
          SITE: ${{ matrix.site }}
        run: |
          python validation_v49/matched_height_valid_direction_elevation.py --site "$SITE" --output "/tmp/v49-${SITE}-matched-source.json"
      - name: Save only original GPS/AHN2/RWS source SHA receipts and paired aggregated results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: original-v49-AHN2-valid-destination-heading-${{ matrix.site }}
          path: /tmp/v49-*-matched-source.json
          retention-days: 90
