name: v37 source-free synthetic tide-gated 3D Boids mechanistic sufficiency
on:
  pull_request:
    paths:
      - "docs/V37_SYNTHETIC_TIDE_GATED_3D_BOIDS_PROTOCOL.md"
      - "validation_v37/**"
      - ".github/workflows/v37-synthetic-tide-Boids.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  synthetic-known-truth-six-ablations:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standard numeric library only
        run: python -m pip install "numpy>=1.26,<3"
      - name: Verify source-free tide, hysteresis and 3D Reynolds heading
        env:
          PYTHONPATH: validation_v37
        run: python -m unittest discover -s validation_v37 -p "test_*.py" -v
      - name: Run all six registered model ablations over twenty-four fixed toy RNG seeds
        run: python validation_v37/simulation.py --out validation_v37/results/synthetic_tide_3D_boids_v37.json
      - name: Log all model outputs in six bounded source-free lines for immutable Git receipt
        run: |
          python - <<'PY'
          import json
          path="validation_v37/results/synthetic_tide_3D_boids_v37.json"
          j=json.load(open(path,encoding="utf-8"))
          assert j["NO_EMPIRICAL_DATA_used"] is True
          meta={k:v for k,v in j.items() if k!="all_ablation_signed_results"}
          print("V37_SOURCE_FREE_METADATA "+json.dumps(meta,sort_keys=True,separators=(",",":")))
          for name,record in j["all_ablation_signed_results"].items():
              print("V37_SOURCE_FREE_MODEL "+name+" "+json.dumps(record,sort_keys=True,separators=(",",":")))
          PY
      - name: Upload full synthetic-only signed result, including failures
        uses: actions/upload-artifact@v4
        with:
          name: boids-v37-source-free-tide-3d-states-motor-ablations
          path: validation_v37/results/synthetic_tide_3D_boids_v37.json
          if-no-files-found: error
          retention-days: 45
