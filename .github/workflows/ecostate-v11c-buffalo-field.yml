name: ecostate v11c original independent buffalo same-raster 20-direction state-choice transfer
on:
  push:
    paths:
      - 'ecostate_v11/buffalo_field_v11c.py'
      - 'ecostate_v11/test_buffalo_field_v11c.py'
      - '.github/workflows/ecostate-v11c-buffalo-field.yml'
  pull_request:
    paths:
      - 'ecostate_v11/buffalo_field_v11c.py'
      - 'ecostate_v11/test_buffalo_field_v11c.py'
      - '.github/workflows/ecostate-v11c-buffalo-field.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-same-raster-ecological-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and fixed scoring dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'pandas>=2,<3' 'rasterio>=1.3,<2'
      - name: Run seven planted-known-truth source and model tests
        run: PYTHONPATH=ecostate_v11 python -m unittest discover -s ecostate_v11 -p 'test_buffalo_field_v11c.py' -v
      - name: Re-fetch four SHA/MD5 checked sources; sample observed and equal-length alternatives symmetrically
        run: python ecostate_v11/buffalo_field_v11c.py ecostate_v11/results/buffalo_state_choice_v11c.json
      - name: Require genuine model verdict or explicit scientific stop
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ecostate_v11/results/buffalo_state_choice_v11c.json')
          v=json.loads(p.read_text())
          assert v['status'] in ('SOURCE_OR_MODEL_STOP','FIELD_COMPUTED_EXPLORATORY')
          assert v['raw_gps_coordinates_or_source_node_strings_exported'] is False
          if v['status']=='FIELD_COMPUTED_EXPLORATORY':
            assert v['heldout_source_device_groups']>=10
            assert v['prespecified_numeric_gate'] in ('PASS','FAIL')
            assert v['original_source_nodes_are_independent_biological_individuals']=='UNVERIFIED'
          print('V11C_SCIENTIFIC_STATUS',v['status'],v.get('prespecified_numeric_gate'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ecostate-v11c-original-buffalo-source-verified-choice-or-source-stop
          path: ecostate_v11/results/buffalo_state_choice_v11c.json
          retention-days: 45
          if-no-files-found: error
