name: bat original IF TF 24-case evidence-ledger replay
on:
  push:
    branches: ["prospective/bat-acoustic-game-no-new-measurements-v1"]
    paths:
      - "theory/bat_acoustic_game/verify_IF_TF_source_time_ledger_v1.py"
      - "theory/bat_acoustic_game/IF_TF_SOURCE_TIME_PHYSICAL_CONVENTION_LEDGER_V1.json"
      - ".github/workflows/bat-IF-TF-source-ledger-replay-v1.yml"
  workflow_dispatch:
jobs:
  source-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    defaults:
      run:
        working-directory: theory/bat_acoustic_game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recompute all 24 aggregate source cells and source chronology from publisher-original data
        run: python verify_IF_TF_source_time_ledger_v1.py
