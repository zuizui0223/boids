name: v163 genuine C-POD Table A1 month-row trim then frozen geographic and year holdouts

on:
  push:
    branches: ["research/v163-*"]
  pull_request:
    paths:
      - "validation_v163/**"
      - "docs/V163*"
      - ".github/workflows/v163-porpoise-tableA1-record-trim.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tableA1_source_rowtrim_sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original source logistic dependencies
        run: python -m pip install numpy==2.1.3 scipy==1.14.1 scikit-learn==1.5.2
      - name: Test source clip leap-year and strict no-imputed source hours
        run: python -m unittest discover -s validation_v163 -p 'test_*.py' -v
      - name: Reacquire full original 26MB CSV, trim source by published Table A1 months, rerun fixed v160-v161 models
        run: python validation_v163/original_tableA1_month_row_trim.py --emit
      - name: Preserve source-safe site/year model score artifact, never original click event rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v163-original-porpoise-monthrow-trim-sensitivity
          path: validation_v163/results/paper_date_record_trim_original_v163.json
          if-no-files-found: warn
