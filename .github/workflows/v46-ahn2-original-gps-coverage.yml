name: v46 original 2010 GPS and historical AHN2 2011-12 substrate overlap gate
on:
  push:
    paths:
      - 'validation_v46/**'
      - 'docs/V46_FROZEN_ORIGINAL_GPS_AHN2_SPATIAL_OVERLAP.md'
      - '.github/workflows/v46-ahn2-original-gps-coverage.yml'
  pull_request:
    paths:
      - 'validation_v46/**'
      - 'docs/V46_FROZEN_ORIGINAL_GPS_AHN2_SPATIAL_OVERLAP.md'
      - '.github/workflows/v46-ahn2-original-gps-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original_gps_2010_train_cell_source_only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        site: [schiermonnikoog, ameland]
    env:
      PYTHONPATH: validation_v29:validation_v30:validation_v31:validation_v33:validation_v34:validation_v40:validation_v45:validation_v46
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small AHN2 source raster and Dutch RD transform dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'rasterio>=1.3,<2' 'pyproj>=3.5,<4'
      - name: Verify original 2010-only tiled source rank and heldout original GPS overlap
        run: python -m unittest discover -s validation_v46 -p 'test_*.py' -v
      - name: Reopen provider original GPS 2010 to rank 8 cells and 2011 2012 to check source geometry only
        env:
          SITE: ${{ matrix.site }}
        run: |
          python validation_v46/source_original_gps_ahn2_overlap.py --site "$SITE" --output "/tmp/v46-ahn2-${SITE}-source.json"
      - name: Save original source checks and aggregated substrate availability only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ahn2-original-gps-destination-source-v46-${{ matrix.site }}
          path: /tmp/v46-ahn2-*-source.json
          retention-days: 90
