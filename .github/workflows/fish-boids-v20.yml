name: Fish-school v20 independent split auditory motor and vocal hearing test
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths:
      - 'validation_fish_boids_v20/**'
      - 'docs/V20_TWO_PATHWAY_ACOUSTIC_FEEDBACK_FREEZE.md'
      - '.github/workflows/fish-boids-v20.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-two-pathway:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen v15 numerical stack
        run: python -m pip install -r validation_fish_boids_v15/requirements.txt
      - name: Source-free known-truth tests for exact original replay and independent sound pathways
        run: python -m unittest discover -s validation_fish_boids_v20 -p 'test_*.py' -v
      - name: Audit 768 new seeds and 16 cue/physical/motor/vocal arms for every source-low group
        run: python validation_fish_boids_v20/score_two_pathways.py --output /tmp/boids-v20 --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: boids-v20-independent-motor-vocal-hearing-factorial-synthetic-only
          path: /tmp/boids-v20
          retention-days: 30
          if-no-files-found: error
