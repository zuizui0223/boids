name: Fish-school v41 source-free speed-turn 2x2 joint source moment and sham outcome invariance tests
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths: ['.github/workflows/fish-school-v41-joint-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artificial-fish-2x2-source-label-invariance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install same native numerical source package stack as v40
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - name: Six synthetic source-known truth tests joint speed×turn original v40 partitions and anti-future leakage
        run: python -m unittest discover -s validation_fish_school_v41 -p 'test_*.py' -v
      - name: Inspect only unchanged original 84 source author Group mapping file
        run: |
          python - <<'PY'
          from validation_fish_school_v32.stickleback_12_shoal import verify_crosswalk_bytes
          from validation_fish_school_v41.joint_speed_turn_bins import JOINT_CATEGORIES
          original=verify_crosswalk_bytes()
          assert len(original)==84 and len(set(original.values()))==12
          assert len(JOINT_CATEGORIES)==4
          print('V41_SOURCE_FREE_NOT_ORIGINAL_Y_2x2_NINE_STRATA_KNOWN_TRUTH_PASS')
          PY
