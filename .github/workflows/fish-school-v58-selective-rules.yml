name: Fish-school v58 balanced pooled illumination-specific rules
on:
  pull_request:
    branches: [research/illumination-block-transfer-v57-20261126]
    paths: ['validation_fish_school_v58/**', '.github/workflows/fish-school-v58-selective-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  selective-rules:
    if: github.head_ref == 'research/illumination-shared-rules-v58-20261126' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - name: Reacquire pinned originals and previous score artifacts
        run: |
          git clone --depth=1 --branch v1.0.0 https://github.com/swarmintelligencelab/IntermittentExploration.git external_intermit
          test "$(git -C external_intermit rev-parse HEAD)" = 2eb7fdd4172fff870224b7cbc4d7bdb086b5fbf0
          gh api /repos/zuizui0223/boids/actions/artifacts/15007229391/zip > v54-schema-diagnostic.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/15008044634/zip > v55-illumination.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/15009722292/zip > v56-transfer.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/15070798416/zip > v57-transplant.zip
      - name: Replay original fits and evaluate all eight balanced pooled model structures
        run: python -m validation_fish_school_v58.selective_rules --source external_intermit --diagnostic v54-schema-diagnostic.zip --v55 v55-illumination.zip --v56 v56-transfer.zip --v57 v57-transplant.zip --out validation_fish_school_v58/results/selective.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v58-balanced-selective-rules
          path: validation_fish_school_v58/results/selective.json
          if-no-files-found: error
          retention-days: 30
