name: v145 actual California 9-site constrained circular day-block chorus null
on:
  push:
    branches: ["research/v145-*"]
  pull_request:
    paths:
      - "validation_v145/**"
      - "docs/V145*"
      - ".github/workflows/v145-blockshift.yml"
  workflow_dispatch:
jobs:
  original_restricted_null:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned source XLS reader and solar package
        run: python -m pip install xlrd==2.0.2 astral==3.2
      - name: Synthetic invariants and source-day-block shift null checks
        run: python -m unittest discover -s validation_v145 -p 'test_*.py' -v
      - name: Reacquire all source XLS and run autocorrelation-aware date-block conditioned cochorus null
        run: python validation_v145/v145_blockshift.py
      - name: Test source-hour chorus onset transition timing with same whole-day shifts
        run: python validation_v145/v145_onset_null.py
      - name: Preserve source-aggregated conditional null results, not original XLS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v145-original-site-chorus-dayblock-shift-null
          path: |
            validation_v145/results/source_blockshift_cochorus_null.json
            validation_v145/results/onset_transition_original_blocknull.json
          if-no-files-found: warn
