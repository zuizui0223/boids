name: Fish-school v56 common-state and cross-illumination transfer
on:
  pull_request:
    branches: [research/visual-channel-triad-v54-20261125]
    paths: ['validation_fish_school_v56/**', '.github/workflows/fish-school-v56-common-state-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    if: github.head_ref == 'research/illumination-transfer-v56-20261125' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - run: |
          git clone --depth=1 --branch v1.0.0 https://github.com/swarmintelligencelab/IntermittentExploration.git external_intermit
          test "$(git -C external_intermit rev-parse HEAD)" = 2eb7fdd4172fff870224b7cbc4d7bdb086b5fbf0
          gh api /repos/zuizui0223/boids/actions/artifacts/15007229391/zip > v54-schema-diagnostic.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/15008044634/zip > v55-illumination.zip
      - name: Reauthenticate and replay v55, standardize common states and score cross-light transfer
        run: python -m validation_fish_school_v56.common_state_transfer --source external_intermit --diagnostic v54-schema-diagnostic.zip --prior v55-illumination.zip --out validation_fish_school_v56/results/transfer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v56-common-state-and-light-transfer
          path: validation_fish_school_v56/results/transfer.json
          if-no-files-found: error
          retention-days: 30
