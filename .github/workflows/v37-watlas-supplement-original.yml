name: v37 original published WATLAS red knot paired-heading source gate
on:
  push:
    paths:
      - 'validation_v37/**'
      - 'docs/V37_WATLAS_ORIGINAL_SEVEN_RED_KNOT_SOURCE_GATE.md'
      - '.github/workflows/v37-watlas-supplement-original.yml'
  pull_request:
    paths:
      - 'validation_v37/**'
      - 'docs/V37_WATLAS_ORIGINAL_SEVEN_RED_KNOT_SOURCE_GATE.md'
      - '.github/workflows/v37-watlas-supplement-original.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-watlas-data-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: validation_v37
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify original-localization interval and dyad eligibility controls
        run: python -m unittest discover -s validation_v37 -p 'test_*.py' -v
      - name: Open licensed original Figshare 26553440 WATLAS supplementary CSV and source quality receipt
        run: python validation_v37/watlas_published_pair_source.py --output /tmp/boids_v37_watlas_source.json
      - name: Save source-level quality aggregate only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seven-red-knot-one-tide-figshare-source-audit-v37
          path: /tmp/boids_v37_watlas_source.json
          retention-days: 90
