name: v150 real 60-source day-bout preserving +/-1h/2h acoustic shifted controls
on:
  push:
    branches: ["research/v150-*"]
  pull_request:
    paths:
      - "validation_v150/**"
      - "docs/V150*"
      - ".github/workflows/v150-original-bout-shifts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source_bout_shift:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned original reader and solar source logic
        run: python -m pip install xlrd==2.0.2 astral==3.2
      - name: Test exact source-free bout and solar gate invariants
        run: python -m unittest discover -s validation_v150 -p 'test_*.py' -v
      - name: Reacquire all 60 original XLS source and compute bout-preserving controls
        run: python validation_v150/v150_bout_shift.py --check
      - name: Preserve original aggregate only, no original source event timestamps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v150-original-acoustic-bout-preserving-control
          path: validation_v150/results/source_boutshift_full_v150.json
          if-no-files-found: warn
