name: v155 original acoustic own-persistence and sound-partner day-ghost holdout

on:
  push:
    branches: ["research/v155-*"]
  pull_request:
    paths:
      - "validation_v155/**"
      - "docs/V155*"
      - ".github/workflows/v155-original-self-partner-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_source_year_holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned original XLS reader, astronomy and sklearn
        run: python -m pip install xlrd==2.0.2 astral==3.2 numpy==2.1.3 scikit-learn==1.5.2 scipy==1.14.1
      - name: Run genuine-source-free self-history/daily-ghost/no-leakage invariants
        run: python -m unittest discover -s validation_v155 -p 'test_*.py' -v
      - name: Re-fetch all 60 acoustic workbooks, 14 NOAA years, keep true previous hour and score fixed year holdouts
        run: python validation_v155/v155_autopersistence_partner.py --check
      - name: Save only source-safe aggregate result, not raw fish or tide source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v155-original-same-hour-partner-vs-own-history-and-day-ghosts
          path: validation_v155/results/source_partner_autostate_full_v155.json
          if-no-files-found: warn
