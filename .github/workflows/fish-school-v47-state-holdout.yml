name: Fish-school v47 zebrafish dispersion and polarization state
on:
  pull_request:
    branches: [research/fish-school-chorus-v3-20261120]
    paths: ['validation_fish_school_v47/**', '.github/workflows/fish-school-v47-state-holdout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-holdout:
    if: github.head_ref == 'research/collective-state-cross-system-synthesis-20261124' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2'
      - name: Reauthenticate, replay original scores and evaluate frozen group states
        run: python -m validation_fish_school_v47.state_holdout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v47-zebrafish-state-holdout
          path: validation_fish_school_v47/results/state.json
          if-no-files-found: error
          retention-days: 30
