name: v167 genuine 2019 tagged oystercatcher ACC history vs correctly timed measured RWS tide
on:
  push:
    branches: ["research/v167-*"]
  pull_request:
    paths:
      - "validation_v167/**"
      - "docs/V167*"
      - ".github/workflows/v167-original-2019-bird-history-tide.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original_2019_tagged_bird_history_and_RWS:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONPATH: validation_v109:validation_v110:validation_v111:validation_v125:validation_v126:validation_v127:validation_v128:validation_v129:validation_v130:validation_v165:validation_v166:validation_v167
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact source astronomy/numeric dependencies
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2'
      - name: Test genuine-source-free correct 2019 previous bin and model constants
        run: python -m unittest discover -s validation_v167 -p 'test_*.py' -v
      - name: Recover original publisher-MD5 GPS ACC v126, 2019 observed 48h RWS pilot and four-month RWS SHA v127
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v126gps /tmp/v126rws /tmp/v127
          gh run download 43220491868 --repo zuizui0223/boids --name v126-GENUINE-2019-VLIELAND-FORAGE-INACTIVE-GPS-15MIN-25KM-SOURCE --dir /tmp/v126gps
          test -s /tmp/v126gps/v126-real-2019-Vlieland-forage-inactive-GPS-MD5-15min-source-only.json
          gh run download 43220491868 --repo zuizui0223/boids --name v126-ORIGINAL-RWS-2019-VLIELAND-HAVEN-MEASURED-TIDE-SOURCE --dir /tmp/v126rws
          test -s /tmp/v126rws/v126-real-2019-RWS-Vlieland-Haven-10min-original-NAP-source-only.json
          gh run download 43461048062 --repo zuizui0223/boids --name v127-ORIGINAL-2019-VLIELAND-ACC-CLASS-FORAGE-RWS-TIDE-SUN-OR-SOURCE-STOP --dir /tmp/v127
          test -s /tmp/v127/v127-original-2019-Vlieland-ACC-forage-share-true-RWS-tide-sun-fourway.json
      - name: Reacquire 2019 original Zenodo GPS ACC and all original measured RWS, score same 2018 model within genuine 2019 weeks
        run: |
          python -u validation_v167/original_2019_history_tide_replay.py --v126-original-gps /tmp/v126gps/v126-real-2019-Vlieland-forage-inactive-GPS-MD5-15min-source-only.json --v126-original-rws /tmp/v126rws/v126-real-2019-RWS-Vlieland-Haven-10min-original-NAP-source-only.json --v127-original /tmp/v127/v127-original-2019-Vlieland-ACC-forage-share-true-RWS-tide-sun-fourway.json --check
      - name: Save only source-safe anonymous weekly score and source result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v167-original-2019-bird-true-prev15-real-and-ghost-measured-RWS
          path: validation_v167/results/original_2019_vlieland_history_tide_weekcv_v167.json
          if-no-files-found: warn
