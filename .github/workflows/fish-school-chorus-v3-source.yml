name: Fish-school v3 original source gate (source only)
on:
  push:
    branches:
      - research/fish-school-chorus-v3-20261120
    paths:
      - "validation_fish_school_v3/**"
      - ".github/workflows/fish-school-chorus-v3-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test original source gating with offline fixtures
        run: python -m unittest discover -s validation_fish_school_v3 -p "test_*.py" -v
      - name: Probe official Ota Dryad original source without scoring ecology
        run: python validation_fish_school_v3/dryad_source_gate.py
      - name: Preserve structural-source status only
        uses: actions/upload-artifact@v4
        with:
          name: fish-school-v3-ota-source-status
          path: validation_fish_school_v3/results/ota_original_source_gate.json
          retention-days: 30
