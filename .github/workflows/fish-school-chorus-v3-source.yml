name: Fish-school v3 official Ota source gate (pagination corrected)
on:
  push:
    branches:
      - research/fish-school-chorus-v3-20261120
    paths:
      - "validation_fish_school_v3/**"
      - ".github/workflows/fish-school-chorus-v3-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test source-only access and pagination with known truth fixtures
        run: python -m unittest discover -s validation_fish_school_v3 -p "test_*.py" -v
      - name: Read official original file manifest, sizes and checksum only
        run: python validation_fish_school_v3/source_page_audit.py
      - name: Save public-source status (no biological outcomes)
        uses: actions/upload-artifact@v4
        with:
          name: fish-school-v3-ota-source-status
          path: validation_fish_school_v3/results/ota_original_source_gate.json
          retention-days: 30
