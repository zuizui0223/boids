name: Fish-school v62 empirical occupancy confinement
on:
  pull_request:
    branches: [research/illumination-dynamics-v61-20261127]
    paths: ['validation_fish_school_v62/**', '.github/workflows/fish-school-v62-empirical-confinement.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  confinement:
    if: github.head_ref == 'research/illumination-confinement-v62-20261127' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - light: Bright
            artifact: 15172436048
          - light: Dark
            artifact: 15172420995
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.2,<4' 'scikit-learn>=1.5,<2'
      - name: Reacquire pinned original source and prior score artifacts
        run: |
          git clone --depth=1 --branch v1.0.0 https://github.com/swarmintelligencelab/IntermittentExploration.git external_intermit
          test "$(git -C external_intermit rev-parse HEAD)" = 2eb7fdd4172fff870224b7cbc4d7bdb086b5fbf0
          gh api /repos/zuizui0223/boids/actions/artifacts/15007229391/zip > v54-schema-diagnostic.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/15008044634/zip > v55-illumination.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/15088179956/zip > v59-rollout.zip
          gh api /repos/zuizui0223/boids/actions/artifacts/${{ matrix.artifact }}/zip > v61-light.zip
      - name: Replay every v61 long-support score, then test fixed occupancy constraints
        run: python -m validation_fish_school_v62.empirical_confinement --light ${{ matrix.light }} --source external_intermit --diagnostic v54-schema-diagnostic.zip --v55 v55-illumination.zip --v59 v59-rollout.zip --v61 v61-light.zip --out validation_fish_school_v62/results/${{ matrix.light }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v62-empirical-confinement-${{ matrix.light }}
          path: validation_fish_school_v62/results/${{ matrix.light }}.json
          if-no-files-found: error
          retention-days: 30
