name: Fish-school v34b author-verified original VR fish small ZIP and 3D experiment code archive audit
on:
  push:
    branches: [research/fish-school-chorus-v3-20261120]
    paths: ['.github/workflows/fish-school-v34b-small-original-files.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-published-small-figshare-code-and-zip-toc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Seven source-only original provider MD5 and archive source-error fixtures
        run: python -m unittest discover -s validation_fish_school_v34 -p 'test_original_small_source_files.py' -v
      - name: Download ONLY four small exact author files; check original MD5+size before ZIP member list/code metadata
        run: |
          python -m validation_fish_school_v34.original_small_source_files \
            --output validation_fish_school_v34/results/original_figshare_2026_zip_code_toc_audit.json
      - name: Reject claimed fish original trajectory/sample and behavioral interventions from code/ZIP schema
        run: |
          python - <<'PY'
          import json
          d=json.load(open('validation_fish_school_v34/results/original_figshare_2026_zip_code_toc_audit.json'))
          assert d['status'] in ('ALL_THREE_ORIGINAL_AUTHOR_SMALL_SOURCE_RECORDS_VERIFIED','PARTIAL_ORIGINAL_SOURCE_ACCESS_STOP','SOURCE_ACCESS_STOP')
          assert d['original_2026_research_trial_values_read'] is False
          assert d['original_agent_position_trajectories_read'] is False
          assert d['original_experimental_treatment_effect_fit'] is False
          assert len(d['source_per_record'])==3
          for article,v in d['source_per_record'].items():
              if v.get('status')=='ALL_PREDECLARED_SMALL_ORIGINAL_AUTHOR_FILE_MD5_VERIFIED':
                  assert all(f['original_author_MD5_and_bytes_authentic'] for f in v['source_files'])
                  assert all(f.get('original_author_code_NOT_EXECUTED',True) for f in v['source_files'])
                  assert all(not f.get('original_zip_data_members_read',False) for f in v['source_files'])
          print('V34B_AUTHOR_ORIGINAL_CHECKSUM_CODE_ZIP_SOURCE_ONLY',d['status'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boids-v34b-authenticated-small-original-2026-VR-robot-fish-ZIP-code-TOC
          path: validation_fish_school_v34/results/original_figshare_2026_zip_code_toc_audit.json
          retention-days: 30
          if-no-files-found: error
