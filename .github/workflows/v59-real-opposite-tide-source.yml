name: v59 real opposite tide same-bird source-only feasibility
on:
  push:
    paths:
      - 'validation_v59/**'
      - 'docs/V59_FROZEN_REAL_OPPOSITE_TIDE_MATCH_SOURCE_GATE.md'
      - '.github/workflows/v59-real-opposite-tide-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v59-original-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original_two_island_source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: validation_v29:validation_v30:validation_v31:validation_v32:validation_v33:validation_v34:validation_v39:validation_v40:validation_v41:validation_v43:validation_v52:validation_v53:validation_v54:validation_v55:validation_v56:validation_v57:validation_v58:validation_v59
      BOIDS_ORIGINAL_RWS_CACHE_DIR: /tmp/boids_original_rws_v59_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unchanged numeric requirements
        run: python -m pip install -r requirements.txt
      - name: Restore authenticated original RWS transport
        uses: actions/cache/restore@v4
        with:
          path: /tmp/boids_original_rws_v59_cache
          key: rws-v59-original-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rws-v59-original-${{ github.ref_name }}-
      - name: New v59 source-only tests, old original source regression tests
        run: |
          python -m unittest discover -s validation_v59 -p 'test_*.py' -v
          python -m unittest discover -s validation_v58 -p 'test_*.py' -v
          python -m unittest discover -s validation_v57 -p 'test_*.py' -v
          python -m unittest discover -s validation_v56 -p 'test_*.py' -v
          python -m unittest discover -s validation_v43 -p 'test_*.py' -v
      - name: Authenticate 2010 and 2011 GPS plus RWS, audit real 2011 phase pairs
        run: |
          python validation_v59/run_real_matched_source_gate.py --source-cache-dir "$BOIDS_ORIGINAL_RWS_CACHE_DIR" --output /tmp/v59-original-opposite-tide-source-only.json
      - name: Save recovered authenticated official RWS transport even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/boids_original_rws_v59_cache
          key: rws-v59-original-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish aggregate-only source feasibility, no raw bird data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v59-original-observed-opposite-tide-source-only
          path: /tmp/v59-original-opposite-tide-source-only.json
          retention-days: 90
          if-no-files-found: error
