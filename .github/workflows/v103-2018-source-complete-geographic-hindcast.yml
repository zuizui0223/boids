name: v103 original 2018 year and independent coastal-region hindcast after source-complete v102 recovery
on:
  push:
    paths:
      - 'validation_v98/**'
      - '.github/workflows/v103-2018-source-complete-geographic-hindcast.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v103_2019_only_train_2018_original_hourly_external_year_and_geo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: validation_v89:validation_v92:validation_v93:validation_v94:validation_v95:validation_v96:validation_v97:validation_v98:validation_v99:validation_v100:validation_v101:validation_v102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: original science packages
        run: python -m pip install 'numpy==1.26.4' 'astral==3.2'
      - name: Test source-year and 100km cross-band cluster identity (no same-region train/test leakage)
        run: python -m unittest discover -s validation_v98 -p 'test_*.py' -v
      - name: Do not compute any temporal transfer before v102 8 original 2018 source bands are genuinely source-complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 105); do
            status=$(gh api 'repos/zuizui0223/boids/actions/runs/42735066255' --jq '.conclusion // "pending"')
            n=$(gh api 'repos/zuizui0223/boids/actions/runs/42735066255/artifacts?per_page=100' --jq '.total_count')
            echo "V103_ORIGINAL_2018_COMPLETE_SOURCE_GATE v102=$status artifacts=$n"
            if [ "$status" = "success" ]; then
              [ "$n" -ge 4 ] || { echo STOP_V102_ORIGINAL_SOURCE_ARTIFACTS_MISSING; exit 2; }
              break
            fi
            [ "$status" != "failure" ] && [ "$status" != "cancelled" ] || { echo STOP_V102_ORIGINAL_SOURCE_FAILED; exit 2; }
            sleep 10
          done
          [ "$(gh api 'repos/zuizui0223/boids/actions/runs/42735066255' --jq '.conclusion')" = "success" ] || { echo STOP_V102_UNFINISHED_SOURCE; exit 2; }
      - name: Download 2019 original world all 12 source bands; exact 564 physical source gauges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42616065580 --repo zuizui0223/boids --pattern 'v94-2019-original-UHSLC-PHYSICAL-BAND-*' --dir /tmp/v94
          test "$(find /tmp/v94 -name 'v94-2019-original-source-*.json' | wc -l)" -eq 12
      - name: Download source-verified 2018 original eight-bands union from v102 (including genuine invalid source statuses)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42735066255 --repo zuizui0223/boids --name v102-2018-UHSLC-8-original-source-bands-REASSEMBLED --dir /tmp/v102
          test "$(find /tmp/v102 -name 'v97-original-UHSLC-2018-*.json' | wc -l)" -eq 8
      - name: Fit strictly source-derived 2019 other 15-degree bands and test original 2018 native water-height solar outside geography and calendar-year window
        run: |
          python -u validation_v98/heldout_2018_geo_year_physical.py --v94-dir /tmp/v94 --v97-dir /tmp/v102 --output /tmp/v103-REAL-2018-original-UHSLC-independent-year-geography-hindcast.json
      - name: Publish original 2018 year heldout band results separately from v100 physically expected null and any biology
        uses: actions/upload-artifact@v4
        with:
          name: v103-REAL-UHSLC-2018-YEAR-AND-UNSEEN-REGION-PHYSICAL-HINDCAST
          path: /tmp/v103-REAL-2018-original-UHSLC-independent-year-geography-hindcast.json
          retention-days: 90
          if-no-files-found: error
