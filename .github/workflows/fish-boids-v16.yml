name: Fish-school v16 prospectively frozen pre-state susceptibility holdout
on:
  workflow_dispatch:
  push:
    branches:
      - research/fish-school-chorus-v3-20261120
    paths:
      - 'validation_fish_boids_v16/**'
      - 'docs/V16_PRESTATE_SUSCEPTIBILITY_FREEZE.md'
      - 'validation_fish_boids_v15/simulation.py'
      - 'validation_fish_boids_v15/analysis.py'
      - '.github/workflows/fish-boids-v16.yml'
permissions:
  contents: read
jobs:
  synthetic-v16-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: python -m pip install -r validation_fish_boids_v15/requirements.txt
      - name: Preflight v15 and new v16 regression suites
        run: |
          python -m unittest discover -s validation_fish_boids_v15 -p 'test_*.py' -q
          python -m unittest discover -s validation_fish_boids_v16 -p 'test_*.py' -v
      - name: Score the exact 192 independent synthetic seeds
        run: python validation_fish_boids_v16/run_holdout.py --output /tmp/v16-results --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: fish-boids-v16-independent-prestate-holdout-synthetic-only
          path: /tmp/v16-results
          retention-days: 30
          if-no-files-found: error
